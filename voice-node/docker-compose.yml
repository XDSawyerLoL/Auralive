services:
  mairaiy-voice:
    image: ghcr.io/debpalash/voicestudio:stable
    container_name: aura-mairaiy-voice
    restart: unless-stopped
    ports:
      - "127.0.0.1:3900:3900"
    environment:
      OMNIVOICE_API_KEY: ${OMNIVOICE_API_KEY:?set OMNIVOICE_API_KEY}
    volumes:
      - aura-mairaiy-data:/app/omnivoice_data
      - aura-mairaiy-hf:/root/.cache/huggingface

volumes:
  aura-mairaiy-data:
  aura-mairaiy-hf:
