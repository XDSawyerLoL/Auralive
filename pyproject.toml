[project]
name = "auralive"
version = "2.0.0a1"
description = "Moteur local d'automatisation Twitch, OBS et IA centré sur Mairaiy"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
