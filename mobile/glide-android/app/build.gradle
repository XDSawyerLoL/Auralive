plugins {
    id "com.android.application"
}

android {
    namespace "com.quantic.glide"
    compileSdk 35

    defaultConfig {
        applicationId "com.quantic.glide"
        minSdk 26
        targetSdk 35
        versionCode 13001
        versionName "1.3.0-beta.1"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
        release {
            minifyEnabled false
        }
    }
}
