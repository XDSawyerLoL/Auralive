<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="/static/avatar/avatar.css?v=2.4.0">
</head>
<body>

    <div class="energy-field"><i></i><i></i><i></i></div>

    <div class="avatar-frame">
      <img id="avatar-idle" class="avatar-image idle-image" src="/static/avatar/mairaiy-idle.png?v=2.1.0" alt="Mairaiy au repos">
      <img id="avatar-speaking" class="avatar-image speaking-image" src="/static/avatar/mairaiy-speaking.png?v=2.1.0" alt="Mairaiy en train de parler">
    </div>
    <section id="caption" class="caption hidden">
      <p id="caption-text"></p>
      <div class="voice-bars"><i></i><i></i><i></i><i></i><i></i></div>
    </section>
  </main>
  <audio id="avatar-audio" preload="auto"></audio>
  <script src="/static/avatar/avatar.js?v=2.4.0"></script>
</body>
</html>
