<!doctype html>
<html lang="fr" data-mode="__COMPLETE_OVERLAY_MODE__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aura Live Overlay</title>
  <link rel="stylesheet" href="/static/complete-overlays.css?v=1.2.0">
</head>
<body>
  <div id="emote-stage" class="emote-stage"></div>
  <section id="topwords-widget" class="topwords-widget hidden">
    <header><span>TOPWORDS</span><h1 id="topwords-title">Vote du Spot</h1></header>
    <div id="topwords-bars"></div>
  </section>
  <section id="giveaway-widget" class="giveaway-widget hidden">
    <div class="giveaway-ring"><div class="giveaway-core"><small>AURA LIVE</small><b id="giveaway-winner">TIRAGE</b></div></div>
    <h2 id="giveaway-title">Concours du Spot</h2>
  </section>
  <section id="credits-widget" class="credits-widget hidden">
    <div class="credits-brand"><div class="credits-orb"></div><span>AURA LIVE</span><h1>Merci pour le live</h1></div>
    <div class="credits-scroll" id="credits-scroll"></div>
  </section>
  <section id="ping-widget" class="ping-widget hidden">
    <span id="ping-priority">PING</span><h2 id="ping-title">Modération</h2><p id="ping-message"></p>
  </section>
  <script src="/static/complete-overlays.js?v=1.2.0"></script>
</body>
</html>
