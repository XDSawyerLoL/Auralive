<!doctype html>
<html lang="fr" data-mode="__AURA_OVERLAY_MODE__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aura Live Overlay</title>
  <link rel="stylesheet" href="/static/overlay.css?v=2.0.6">
</head>
<body>
  <div id="fx-field"><i></i><i></i><i></i></div>
  <div id="counter-dock"></div>
  <div id="chat-dock"></div>
  <div id="goal-widget" class="hidden"><div class="goal-head"><span id="goal-title">OBJECTIF</span><b id="goal-value">0 / 100</b></div><div class="goal-track"><i id="goal-progress"></i></div><small id="goal-unit"></small></div>
  <div id="alert-card" class="hidden" data-layout="card">
    <div id="alert-media" class="alert-media hidden"></div>
    <div class="alert-orb"><span></span><i></i></div>
    <div class="alert-body"><div id="event-label">MAIRAIY</div><strong id="viewer"></strong><p id="message"></p></div>
  </div>
  <audio id="alert-audio" preload="auto"></audio>
  <script src="/static/overlay.js?v=2.0.6"></script>
</body>
</html>
