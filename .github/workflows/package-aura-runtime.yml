name: Package AURA Runtime standalone

on:
  push:
    branches: [main]
    paths:
      - "aura_runtime/**"
      - "tests/test_aura_runtime_standalone.py"
      - ".github/workflows/package-aura-runtime.yml"
  pull_request:
    branches: [main]
    paths:
      - "aura_runtime/**"
      - "app/services/aura_cloud_worker.py"
      - "tests/test_aura_runtime_standalone.py"
      - "tests/test_aura_cloud_worker.py"
      - ".github/workflows/package-aura-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura_runtime/requirements.txt
      - name: Install standalone dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r aura_runtime/requirements.txt
          pip install pytest pytest-asyncio
      - name: Compile standalone runtime
        run: python -m compileall -q aura_runtime
      - name: Prove runtime independence
        run: pytest -q tests/test_aura_runtime_standalone.py
      - name: Import smoke
        run: |
          python - <<'PY'
          from aura_runtime import AuraRuntimeWorker
          from aura_runtime.standalone import StandaloneRuntimeHost, runtime_settings_from_env
          assert AuraRuntimeWorker.VERSION == 'aura-runtime-worker-v3'
          print('AURA Runtime import OK')
          PY
      - name: Build standalone package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/AURA-Runtime"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cp -R aura_runtime "$ROOT/aura_runtime"
          cp aura_runtime/requirements.txt "$ROOT/requirements.txt"
          cp aura_runtime/.env.example "$ROOT/.env.example"
          cp ARCHITECTURE-QUANTIC-SILLAGE.md "$ROOT/ARCHITECTURE-QUANTIC-SILLAGE.md"
          python -m compileall -q "$ROOT/aura_runtime"
          (cd "$RUNNER_TEMP" && zip -qr AURA-Runtime-standalone.zip AURA-Runtime)
          test -s "$RUNNER_TEMP/AURA-Runtime-standalone.zip"
          cp "$RUNNER_TEMP/AURA-Runtime-standalone.zip" .
      - name: Upload AURA Runtime standalone
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Runtime-standalone
          path: AURA-Runtime-standalone.zip
          if-no-files-found: error
          retention-days: 30
