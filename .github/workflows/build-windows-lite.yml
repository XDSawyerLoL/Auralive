name: Build Aura Live Windows Lite

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "config/**"
      - "scripts/build-windows-lite.ps1"
      - "requirements*.txt"
      - ".env.example"
      - ".github/workflows/build-windows-lite.yml"
  workflow_dispatch:

jobs:
  build-windows-lite:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app

      - name: Build AuraLive Lite
        shell: pwsh
        run: .\scripts\build-windows-lite.ps1 -Python python

      - name: Verify Lite package
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AuraLive\AuraLive.exe")) { throw "AuraLive.exe absent." }
          if (-not (Test-Path "dist\AuraLive\BUILD-ID.txt")) { throw "BUILD-ID.txt absent." }
          $buildId = (Get-Content "dist\AuraLive\BUILD-ID.txt" -Raw).Trim()
          if ($buildId -ne "AuraLive-2.5-Windows-FastVoiceOAuth-LITE-2026-09-05") {
            throw "Build ID inattendu: $buildId"
          }
          $envContent = Get-Content "dist\AuraLive\.env" -Raw
          if ($envContent -notmatch "MAIRAIY_KOKORO_AUTO_DOWNLOAD=true") {
            throw "Le telechargement automatique Kokoro n'est pas actif."
          }
          if (Test-Path "dist\AuraLive\data\voices\kokoro\kokoro-v1.0.onnx") {
            throw "Le modele Kokoro ne doit pas etre embarque dans le build Lite."
          }
          if (Test-Path "dist\AuraLive\data\voices\kokoro\voices-v1.0.bin") {
            throw "Le pack de voix Kokoro ne doit pas etre embarque dans le build Lite."
          }

      - name: Smoke test first-run Kokoro download without OBS
        shell: pwsh
        env:
          AURA_PORT: "18787"
          AURA_PUBLIC_BASE_URL: "http://localhost:18787"
          TWITCH_REDIRECT_URI: "http://localhost:18787/auth/callback"
          AI_MODE: "off"
          OBS_AUTO_CONNECT: "false"
          OBS_ENABLED: "false"
          MAIRAIY_KOKORO_PRIMARY: "true"
          MAIRAIY_KOKORO_ENABLED: "true"
          MAIRAIY_KOKORO_AUTO_DOWNLOAD: "true"
          MAIRAIY_KOKORO_VOICE: "ff_siwis"
          MAIRAIY_KOKORO_LANGUAGE: "fr-fr"
        run: |
          $tempKokoro = Join-Path $env:RUNNER_TEMP "AuraLive-Kokoro-FirstRun"
          if (Test-Path $tempKokoro) { Remove-Item $tempKokoro -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tempKokoro | Out-Null
          $env:MAIRAIY_KOKORO_DIR = $tempKokoro

          $process = Start-Process "dist\AuraLive\AuraLive.exe" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { throw "AuraLive.exe s'est ferme au demarrage." }
              try {
                $health = Invoke-WebRequest "http://127.0.0.1:18787/health" -UseBasicParsing -TimeoutSec 2
                if ($health.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "AuraLive Lite n'a pas demarre." }

            $voice = Invoke-RestMethod "http://127.0.0.1:18787/api/avatar/test" `
              -Method Post `
              -ContentType "application/json" `
              -Body '{"text":"Test de la voix locale Mairaiy sans OBS."}' `
              -TimeoutSec 180

            if ($voice.engine -ne "kokoro-local") {
              $voice | ConvertTo-Json -Depth 8 | Write-Host
              throw "Le premier test vocal n'a pas utilise Kokoro local."
            }
            if (-not $voice.audio_url) { throw "Aucune URL audio generee." }
            if (-not (Test-Path (Join-Path $tempKokoro "kokoro-v1.0.onnx"))) { throw "Modele Kokoro non telecharge." }
            if (-not (Test-Path (Join-Path $tempKokoro "voices-v1.0.bin"))) { throw "Voix Kokoro non telechargees." }

            $audio = Invoke-WebRequest ("http://127.0.0.1:18787" + $voice.audio_url) -UseBasicParsing -TimeoutSec 15
            if ($audio.RawContentLength -le 44) { throw "WAV Kokoro vide." }
            Write-Host "Valide: build Lite, telechargement Kokoro automatique, WAV genere sans OBS."
          } finally {
            if (-not $process.HasExited) {
              try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
            }
          }

      - name: Upload Windows Lite application
        uses: actions/upload-artifact@v4
        with:
          name: AuraLive-Windows-FastVoiceOAuth-LITE
          path: dist/AuraLive
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
