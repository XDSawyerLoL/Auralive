name: Build Quantic Studio Windows Lite

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "aura_runtime/**"
      - "engine/quantic-live/**"
      - "config/**"
      - "scripts/build-windows-lite.ps1"
      - "scripts/install-aura-ffmpeg.ps1"
      - "requirements*.txt"
      - ".env.example"
      - ".github/workflows/build-windows-lite.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-lite:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/quantic-live

      - name: Build Quantic Studio Core engine
        shell: pwsh
        run: cargo build --release --locked --manifest-path engine/quantic-live/Cargo.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app aura_runtime

      - name: Build QuanticStudio Lite
        shell: pwsh
        run: .\scripts\build-windows-lite.ps1 -Python python

      - name: Bundle FFmpeg with Windows Graphics Capture
        shell: pwsh
        run: .\scripts\install-aura-ffmpeg.ps1 -Destination "dist\QuanticStudio\ffmpeg"

      - name: Embed Quantic Studio Core
        shell: pwsh
        run: |
          $engine = "engine\quantic-live\target\release\quantic-live.exe"
          if (-not (Test-Path $engine)) {
            throw "Le moteur natif compile est introuvable: $engine"
          }
          Copy-Item $engine "dist\QuanticStudio\QuanticStudioCore.exe" -Force

      - name: Verify Lite package
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\QuanticStudio\QuanticStudio.exe")) { throw "QuanticStudio.exe absent." }
          if (-not (Test-Path "dist\QuanticStudio\BUILD-ID.txt")) { throw "BUILD-ID.txt absent." }
          if (-not (Test-Path "dist\QuanticStudio\QuanticStudioCore.exe")) { throw "QuanticStudioCore.exe absent." }
          if (-not (Test-Path "dist\QuanticStudio\ffmpeg\ffmpeg.exe")) { throw "FFmpeg Aura absent." }
          if (-not (Test-Path "dist\QuanticStudio\aura-source\aura_runtime\worker.py")) { throw "AURA Runtime source absent du package Studio." }
          if (-not (Test-Path "dist\QuanticStudio\aura-source\app\cognitive\evolution.py")) { throw "Source AURA Evolution absente." }
          if (-not (Test-Path "dist\QuanticStudio\aura-source\tests")) { throw "Tests AURA Evolution absents." }
          if (-not (Test-Path "dist\QuanticStudio\aura-source\requirements.txt")) { throw "Requirements AURA Evolution absents." }
          if (-not (Test-Path "dist\QuanticStudio\aura-source\cloud-node\src\cognition.js")) { throw "Sources cloud-node AURA Evolution absentes." }
          $filters = & "dist\QuanticStudio\ffmpeg\ffmpeg.exe" -hide_banner -filters 2>&1 | Out-String
          if ($filters -notmatch "\bgfxcapture\b") { throw "Le FFmpeg Lite ne contient pas gfxcapture." }
          $version = Get-Content "VERSION.json" -Raw | ConvertFrom-Json
          $buildDate = ([string]$version.updated_at).Replace("-", "")
          $expectedBuildId = "QuanticStudio-$($version.studio)-Windows-Native-LITE-$buildDate"
          $buildId = (Get-Content "dist\QuanticStudio\BUILD-ID.txt" -Raw).Trim()
          if ($buildId -ne $expectedBuildId) {
            throw "Build ID inattendu: $buildId (attendu: $expectedBuildId)"
          }
          $envContent = Get-Content "dist\QuanticStudio\.env" -Raw
          if ($envContent -notmatch "MAIRAIY_KOKORO_AUTO_DOWNLOAD=true") {
            throw "Le telechargement automatique Kokoro n'est pas actif."
          }
          if (Test-Path "dist\QuanticStudio\data\voices\kokoro\kokoro-v1.0.onnx") {
            throw "Le modele Kokoro ne doit pas etre embarque dans le build Lite."
          }
          if (Test-Path "dist\QuanticStudio\data\voices\kokoro\voices-v1.0.bin") {
            throw "Le pack de voix Kokoro ne doit pas etre embarque dans le build Lite."
          }

      - name: Smoke test Lite startup and locked Aoede identity without bundled voice assets
        shell: pwsh
        env:
          AURA_PORT: "18787"
          AURA_PUBLIC_BASE_URL: "http://localhost:18787"
          TWITCH_REDIRECT_URI: "http://localhost:18787/auth/callback"
          AI_MODE: "off"
          OBS_AUTO_CONNECT: "false"
          OBS_ENABLED: "false"
          TTS_API_KEY: ""
          AI_API_KEY: ""
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
          MAIRAIY_KOKORO_PRIMARY: "false"
          MAIRAIY_KOKORO_AUTO_DOWNLOAD: "false"
        run: |
          $tempKokoro = Join-Path $env:RUNNER_TEMP "QuanticStudio-Kokoro-NotCanonical"
          if (Test-Path $tempKokoro) { Remove-Item $tempKokoro -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tempKokoro | Out-Null
          $env:MAIRAIY_KOKORO_DIR = $tempKokoro

          $process = Start-Process "dist\QuanticStudio\QuanticStudio.exe" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { throw "QuanticStudio.exe s'est ferme au demarrage." }
              try {
                $health = Invoke-WebRequest "http://127.0.0.1:18787/health" -UseBasicParsing -TimeoutSec 2
                if ($health.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "QuanticStudio Lite n'a pas demarre." }

            $status = Invoke-RestMethod "http://127.0.0.1:18787/api/voice/status" -TimeoutSec 10
            $identity = $status.audio.voice_identity
            if ($status.gemini_required -ne $true -or
                $status.gemini_configured -ne $false -or
                $identity.primary_engine -ne "gemini-tts" -or
                $identity.primary_model -ne "gemini-3.1-flash-tts-preview" -or
                $identity.primary_voice -ne "Aoede" -or
                $identity.generic_fallback_allowed -ne $false) {
              $status | ConvertTo-Json -Depth 10 | Write-Host
              throw "Le build Lite n'est pas verrouille sur Mairaiy Aoede."
            }

            $body = @{ text = "Test Mairaiy sans cle Gemini." } | ConvertTo-Json
            $fallbackBlocked = $false
            try {
              $unexpected = Invoke-RestMethod -Uri "http://127.0.0.1:18787/api/avatar/test" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 20
              $unexpected | ConvertTo-Json -Depth 8 | Write-Host
            } catch {
              $statusCode = [int]$_.Exception.Response.StatusCode
              if ($statusCode -eq 503) { $fallbackBlocked = $true } else { throw }
            }
            if (-not $fallbackBlocked) {
              throw "Le build Lite a substitue une autre voix a Mairaiy."
            }

            if (Test-Path (Join-Path $tempKokoro "kokoro-v1.0.onnx")) {
              throw "Le build Lite a telecharge Kokoro alors qu'il n'est plus la voix canonique."
            }

            $nativeStatus = Invoke-RestMethod "http://127.0.0.1:18787/api/broadcast/status" -TimeoutSec 5
            if ($nativeStatus.mode -ne "native" -or $nativeStatus.engine_available -ne $true) {
              throw "Quantic Studio Core n'est pas disponible dans le build Lite."
            }

            Write-Host "Valide: build Lite stable, Aoede verrouillee, aucun fallback de timbre."
          } finally {
            if (-not $process.HasExited) {
              try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
            }
          }

      - name: Upload Windows Lite application
        uses: actions/upload-artifact@v4
        with:
          name: QuanticStudio-Windows-Native-LITE
          path: dist/QuanticStudio
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
