name: AURA Live Dialogue Probe

on:
  pull_request:
    branches:
      - hostinger/aura-cloud

permissions:
  contents: read

concurrency:
  group: aura-live-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public Hostinger runtime and dialogue continuity
        env:
          AURA_URL: https://antiquewhite-dolphin-780448.hostingersite.com
        run: |
          set -euo pipefail
          CURL=(curl -fsS --retry 2 --retry-delay 2 --max-time 30 -A "Mozilla/5.0 AURA-CI-Smoke/1.0")
          "${CURL[@]}" "$AURA_URL/healthz" -o /tmp/health.json
          "${CURL[@]}" "$AURA_URL/api/kernel/architecture" -o /tmp/architecture.json
          "${CURL[@]}" "$AURA_URL/api/capabilities" -o /tmp/capabilities.json

          "${CURL[@]}" -c /tmp/aura.cookies -b /tmp/aura.cookies \
            -H 'Content-Type: application/json' \
            -d '{"text":"Quelles sont tes trois priorités actuelles ?","author":"AURA-CI-SMOKE"}' \
            "$AURA_URL/api/chat" -o /tmp/chat1.json

          "${CURL[@]}" -c /tmp/aura.cookies -b /tmp/aura.cookies \
            -H 'Content-Type: application/json' \
            -d '{"text":"alors ?","author":"AURA-CI-SMOKE"}' \
            "$AURA_URL/api/chat" -o /tmp/chat2.json

          "${CURL[@]}" -c /tmp/aura.cookies -b /tmp/aura.cookies \
            -H 'Content-Type: application/json' \
            -d '{"text":"Que fais-tu maintenant ?","author":"AURA-CI-SMOKE"}' \
            "$AURA_URL/api/chat" -o /tmp/chat3.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (name) => JSON.parse(fs.readFileSync(name, 'utf8'));
          const health = read('/tmp/health.json');
          const architecture = read('/tmp/architecture.json');
          const capabilities = read('/tmp/capabilities.json');
          const chats = [read('/tmp/chat1.json'), read('/tmp/chat2.json'), read('/tmp/chat3.json')];
          const answers = chats.map((x) => String(x.answer || '').replace(/\s+/g, ' ').trim());
          const failures = [];

          console.log('[live] health=' + JSON.stringify({
            ok: health.ok, ready: health.ready, status: health.status,
            db: health.db, kernel_started: health.kernel_started,
            issues: health.issues, startup_error: health.startup_error,
          }));
          console.log('[live] architecture=' + JSON.stringify({
            organism: architecture.organism,
            language_model_role: architecture.language_model_role,
            final_language_authority: architecture.final_language_authority,
            execution_policy: architecture.execution_policy,
            execution_arm: architecture.execution_arm,
            provider: architecture.provider,
            provider_enabled: architecture.provider_enabled,
          }));
          console.log('[live] capabilities=' + JSON.stringify({
            execution_policy: capabilities.execution_policy,
            cloud_operator_ready: capabilities.cloud_operator_ready,
            local_worker_required: capabilities.local_worker_required,
            language: capabilities.language,
            hands: capabilities.hands,
            evolution: capabilities.evolution,
          }));
          console.log('[live] priorities=' + answers[0].slice(0, 1000));
          console.log('[live] followup_alors=' + answers[1].slice(0, 1000));
          console.log('[live] current_activity=' + answers[2].slice(0, 1000));

          if (health.ready !== true || health.db !== true || health.kernel_started !== true) {
            failures.push('runtime readiness');
          }
          if (architecture.final_language_authority !== 'AURA native cognition') failures.push('final language authority');
          if (architecture.execution_policy !== 'cloud-first-local-optional') failures.push('execution policy');
          if (capabilities.execution_policy !== 'cloud-first-local-optional') failures.push('capability policy');
          if (capabilities.local_worker_required !== false) failures.push('local worker dependency');

          if (!/priorit/i.test(answers[0]) || !/1\)/.test(answers[0])) failures.push('priority response');
          if (/^Message reçu|Recherche Web effectuée/i.test(answers[0])) failures.push('priority generic response');
          if (!/priorit/i.test(answers[1]) || !/1\)/.test(answers[1])) failures.push('follow-up continuity');
          if (answers[2].length < 30 || /^Message reçu/i.test(answers[2])) failures.push('current activity response');

          if (failures.length) throw new Error('LIVE FAILURES: ' + failures.join(' | '));
          NODE
