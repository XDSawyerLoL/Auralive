name: AURA Cloud CI

on:
  push:
    branches:
      - aura/v9.3-cloud-first-native-dialogue
  pull_request:
    branches:
      - hostinger/aura-cloud

permissions:
  contents: read

concurrency:
  group: aura-cloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax and package checks
        run: npm run check

      - name: Test
        run: npm test

  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public Hostinger runtime smoke test
        env:
          AURA_URL: https://antiquewhite-dolphin-780448.hostingersite.com
        run: |
          set -euo pipefail
          CURL=(curl -fsS --retry 2 --retry-delay 2 --max-time 30 -A "Mozilla/5.0 AURA-CI-Smoke/1.0")
          "${CURL[@]}" "$AURA_URL/healthz" -o /tmp/health.json
          "${CURL[@]}" "$AURA_URL/api/kernel/architecture" -o /tmp/architecture.json
          "${CURL[@]}" "$AURA_URL/api/capabilities" -o /tmp/capabilities.json
          "${CURL[@]}" \
            -H 'Content-Type: application/json' \
            -d '{"text":"Quelles sont tes trois priorités actuelles ?","author":"AURA-CI-SMOKE"}' \
            "$AURA_URL/api/chat" -o /tmp/chat.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (name) => JSON.parse(fs.readFileSync(name, 'utf8'));
          const health = read('/tmp/health.json');
          const architecture = read('/tmp/architecture.json');
          const capabilities = read('/tmp/capabilities.json');
          const chat = read('/tmp/chat.json');
          const failures = [];

          console.log('[live] health=' + JSON.stringify({
            ok: health.ok,
            ready: health.ready,
            status: health.status,
            db: health.db,
            kernel_started: health.kernel_started,
            issues: health.issues,
            startup_error: health.startup_error,
          }));
          console.log('[live] architecture=' + JSON.stringify({
            organism: architecture.organism,
            language_model_role: architecture.language_model_role,
            final_language_authority: architecture.final_language_authority,
            execution_policy: architecture.execution_policy,
            execution_arm: architecture.execution_arm,
            provider: architecture.provider,
            provider_enabled: architecture.provider_enabled,
          }));
          console.log('[live] capabilities=' + JSON.stringify({
            execution_policy: capabilities.execution_policy,
            cloud_operator_ready: capabilities.cloud_operator_ready,
            local_worker_required: capabilities.local_worker_required,
            language: capabilities.language,
            hands: capabilities.hands,
            evolution: capabilities.evolution,
          }));

          const answer = String(chat.answer || '');
          console.log('[live] priority_answer=' + answer.replace(/\s+/g, ' ').slice(0, 1000));

          if (health.ok !== true) failures.push('health.ok != true');
          if (health.ready !== true) failures.push('runtime not ready');
          if (health.db !== true) failures.push('database not ready');
          if (health.kernel_started !== true) failures.push('kernel not started');

          if (architecture.final_language_authority !== 'AURA native cognition') {
            failures.push('old language authority still deployed');
          }
          if (architecture.execution_policy !== 'cloud-first-local-optional') {
            failures.push('old execution policy still deployed');
          }
          if (capabilities.execution_policy !== 'cloud-first-local-optional') {
            failures.push('capabilities do not expose Cloud-first policy');
          }
          if (capabilities.local_worker_required !== false) {
            failures.push('local worker still exposed as required');
          }
          if (answer.length < 20) failures.push('chat answer too short');
          if (/Message reçu\s*:/i.test(answer)) failures.push('generic dialogue regression');
          if (!/priorit/i.test(answer) || !/1\)/.test(answer)) {
            failures.push('priority dialogue regression');
          }

          if (failures.length) throw new Error('LIVE FAILURES: ' + failures.join(' | '));
          NODE
