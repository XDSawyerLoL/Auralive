name: Package AURA Hostinger V9.3

on:
  push:
    branches:
      - aura/package-hostinger-v9.3

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4

      - name: Verify deploy package
        run: |
          test -f server.js
          test -f package.json
          test -f package-lock.json
          test -d src
          node --check server.js
          node --check src/server.js
          node -e "const p=require('./package.json'); if(!p.scripts?.start) process.exit(1)"

      - name: Build deploy ZIP
        run: |
          zip -r AURA-HOSTINGER-V9.3-CLOUD-FIRST.zip . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "test/*" \
               "*.log" \
               ".env" \
               ".DS_Store"
          unzip -l AURA-HOSTINGER-V9.3-CLOUD-FIRST.zip | grep -E "server.js|package.json|src/server.js"

      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AURA-HOSTINGER-V9.3-CLOUD-FIRST
          path: AURA-HOSTINGER-V9.3-CLOUD-FIRST.zip
          if-no-files-found: error
          retention-days: 7
