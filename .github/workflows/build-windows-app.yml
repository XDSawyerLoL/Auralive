name: Build Quantic Studio Windows app

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "aura_runtime/**"
      - "engine/quantic-live/**"
      - "config/**"
      - "scripts/build-windows.ps1"
      - "scripts/install-aura-ffmpeg.ps1"
      - "scripts/build-installer.ps1"
      - "scripts/sign-windows.ps1"
      - "installer/**"
      - "requirements*.txt"
      - ".env.example"
      - ".github/workflows/build-windows-app.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "aura_runtime/**"
      - "engine/quantic-live/**"
      - "config/**"
      - "scripts/build-windows.ps1"
      - "scripts/install-aura-ffmpeg.ps1"
      - "scripts/build-installer.ps1"
      - "scripts/sign-windows.ps1"
      - "installer/**"
      - "requirements*.txt"
      - ".env.example"
      - ".github/workflows/build-windows-app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/quantic-live

      - name: Build Quantic Studio Core engine
        shell: pwsh
        run: cargo build --release --locked --manifest-path engine/quantic-live/Cargo.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app aura_runtime

      - name: Build QuanticStudio.exe
        shell: pwsh
        run: .\scripts\build-windows.ps1 -Python python

      - name: Bundle FFmpeg with Windows Graphics Capture
        shell: pwsh
        run: .\scripts\install-aura-ffmpeg.ps1 -Destination "dist\QuanticStudio\ffmpeg"

      - name: Embed Quantic Studio Core
        shell: pwsh
        run: |
          $engine = "engine\quantic-live\target\release\quantic-live.exe"
          if (-not (Test-Path $engine)) {
            throw "Le moteur natif compile est introuvable: $engine"
          }
          Copy-Item $engine "dist\QuanticStudio\QuanticStudioCore.exe" -Force

      - name: Sign Quantic Studio binaries when certificate is configured
        shell: pwsh
        env:
          AURA_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_BASE64 }}
          AURA_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          .\scripts\sign-windows.ps1 -Path @(
            "dist\QuanticStudio\QuanticStudio.exe",
            "dist\QuanticStudio\QuanticStudioCore.exe"
          )


      - name: Verify Windows package
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\QuanticStudio\QuanticStudio.exe")) {
            throw "QuanticStudio.exe est absent du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\BUILD-ID.txt")) {
            throw "BUILD-ID.txt est absent du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\QuanticStudioCore.exe")) {
            throw "QuanticStudioCore.exe est absent du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\ffmpeg\ffmpeg.exe")) {
            throw "Le FFmpeg Aura embarque est absent du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\aura-source\aura_runtime\worker.py")) { throw "AURA Runtime source absent du package Studio." }
          if (-not (Test-Path "dist\QuanticStudio\aura-source\app\cognitive\evolution.py")) {
            throw "L'arbre source AURA Evolution est absent du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\aura-source\tests")) {
            throw "Les tests AURA Evolution sont absents du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\aura-source\requirements.txt")) {
            throw "requirements.txt AURA Evolution est absent du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\aura-source\cloud-node\src\cognition.js")) {
            throw "Le runtime Node AURA Evolution est absent du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\aura-source\VERSION.json")) {
            throw "VERSION.json est absent du package AURA Evolution."
          }
          $filters = & "dist\QuanticStudio\ffmpeg\ffmpeg.exe" -hide_banner -filters 2>&1 | Out-String
          if ($filters -notmatch "\bgfxcapture\b") {
            throw "Le FFmpeg livre ne contient pas gfxcapture."
          }
          $version = Get-Content "VERSION.json" -Raw | ConvertFrom-Json
          $buildDate = ([string]$version.updated_at).Replace("-", "")
          $expectedBuildId = "QuanticStudio-$($version.studio)-Windows-Native-$buildDate"
          $buildId = (Get-Content "dist\QuanticStudio\BUILD-ID.txt" -Raw).Trim()
          if ($buildId -ne $expectedBuildId) {
            throw "Identifiant de build inattendu: $buildId (attendu: $expectedBuildId)"
          }
          if (-not (Test-Path "dist\QuanticStudio\.env")) {
            throw "La configuration locale .env est absente du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\_internal\app\web\templates\setup.html")) {
            throw "L'ecran de configuration locale Twitch est absent du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\_internal\app\web\static\avatar-test-fast.js")) {
            throw "Le test vocal autonome n'est pas embarque dans le package."
          }
          if (-not (Test-Path "dist\QuanticStudio\_internal\app\web\static\aura-studio.js")) {
            throw "Le controleur Aura Studio n'est pas embarque dans le package."
          }
          if (-not (Test-Path "dist\QuanticStudio\_internal\app\web\static\aura-studio.css")) {
            throw "Le theme glossy Aura Studio n'est pas embarque dans le package."
          }
          if (-not (Test-Path "dist\QuanticStudio\_internal\app\web\static\update-center.js")) {
            throw "Le centre de mise a jour n'est pas embarque dans le package."
          }
          $envContent = Get-Content "dist\QuanticStudio\.env" -Raw
          if ($envContent -notmatch "AI_MODE=ollama" -or
              $envContent -notmatch "AI_MODEL=gemma3:12b" -or
              $envContent -notmatch "AI_AUTO_FAST_MODEL=false" -or
              $envContent -notmatch "TTS_MODE=gemini" -or
              $envContent -notmatch "TTS_MODEL=gemini-3.1-flash-tts-preview" -or
              $envContent -notmatch "TTS_VOICE=Aoede" -or
              $envContent -notmatch "MAIRAIY_KOKORO_PRIMARY=false") {
            throw "Le .env livre n'est pas verrouille sur l'identite Mairaiy Aoede."
          }
          $model = Get-Item "dist\QuanticStudio\data\voices\kokoro\kokoro-v1.0.onnx" -ErrorAction Stop
          $voices = Get-Item "dist\QuanticStudio\data\voices\kokoro\voices-v1.0.bin" -ErrorAction Stop
          if ($model.Length -lt 250000000) {
            throw "Le modele Kokoro livre est incomplet: $($model.Length) octets."
          }
          if ($voices.Length -lt 10000000) {
            throw "Le pack de voix Kokoro livre est incomplet: $($voices.Length) octets."
          }
          $forbidden = Get-ChildItem "dist\QuanticStudio" -Recurse -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -eq "Python.Runtime.dll" -or $_.FullName -match "[\\/]pythonnet[\\/]"
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Host $_.FullName }
            throw "Le package contient encore pythonnet/Python.Runtime.dll."
          }

      - name: Smoke test QuanticStudio.exe startup and locked Aoede identity
        shell: pwsh
        env:
          AURA_PORT: "18787"
          AURA_PUBLIC_BASE_URL: "http://localhost:18787"
          TWITCH_REDIRECT_URI: "http://localhost:18787/auth/callback"
          AI_MODE: "off"
          OBS_AUTO_CONNECT: "false"
          TTS_API_KEY: ""
          AI_API_KEY: ""
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
        run: |
          $logPath = "dist\QuanticStudio\QuanticStudio-startup.log"
          if (Test-Path $logPath) { Remove-Item $logPath -Force }
          $process = Start-Process "dist\QuanticStudio\QuanticStudio.exe" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { throw "QuanticStudio.exe s'est ferme pendant le demarrage." }
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:18787/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "QuanticStudio.exe n'a pas expose /health." }

            $voiceStatus = Invoke-RestMethod "http://127.0.0.1:18787/api/voice/status" -TimeoutSec 5
            $identity = $voiceStatus.audio.voice_identity
            if ($voiceStatus.gemini_required -ne $true -or
                $voiceStatus.gemini_configured -ne $false -or
                $identity.primary_engine -ne "gemini-tts" -or
                $identity.primary_model -ne "gemini-3.1-flash-tts-preview" -or
                $identity.primary_voice -ne "Aoede" -or
                $identity.generic_fallback_allowed -ne $false) {
              $voiceStatus | ConvertTo-Json -Depth 10 | Write-Host
              throw "L'identite Mairaiy Aoede n'est pas verrouillee."
            }

            $body = @{ text = "Bonjour Sansa, test de verrouillage vocal." } | ConvertTo-Json
            $fallbackBlocked = $false
            try {
              $unexpected = Invoke-RestMethod -Uri "http://127.0.0.1:18787/api/avatar/test" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 20
              $unexpected | ConvertTo-Json -Depth 8 | Write-Host
            } catch {
              $statusCode = [int]$_.Exception.Response.StatusCode
              if ($statusCode -eq 503) { $fallbackBlocked = $true } else { throw }
            }
            if (-not $fallbackBlocked) {
              throw "Sans cle Gemini, un autre timbre a ete utilise."
            }

            $setupStatus = Invoke-RestMethod "http://127.0.0.1:18787/api/setup/status" -TimeoutSec 5
            if ($setupStatus.gemini_required -ne $true -or
                $setupStatus.gemini_configured -ne $false -or
                $setupStatus.voice.engine_voice -ne "Aoede" -or
                $setupStatus.voice.model -ne "gemini-3.1-flash-tts-preview" -or
                $setupStatus.voice.generic_fallback_allowed -ne $false) {
              $setupStatus | ConvertTo-Json -Depth 8 | Write-Host
              throw "Le panneau local n'annonce pas correctement Mairaiy Aoede."
            }

            $dashboard = Invoke-WebRequest "http://127.0.0.1:18787/" -UseBasicParsing -TimeoutSec 5
            if ($dashboard.Content -notmatch "Quantic Studio") { throw "Dashboard indisponible." }

            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw "QuanticStudio.exe s'est ferme apres le demarrage." }
            $stable = Invoke-WebRequest "http://127.0.0.1:18787/health" -UseBasicParsing -TimeoutSec 3
            if ($stable.StatusCode -ne 200) { throw "Backend Quantic Studio instable." }

            Write-Host "Valide: EXE stable, Aoede verrouillee, aucun fallback de timbre."
          } finally {
            if (-not $process.HasExited) {
              try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
            }
            $global:LASTEXITCODE = 0
          }

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = Get-Content "VERSION.json" -Raw | ConvertFrom-Json
          .\scripts\build-installer.ps1 -Version ([string]$version.studio) -SourceDir "dist\QuanticStudio"

      - name: Sign installer when certificate is configured
        shell: pwsh
        env:
          AURA_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_BASE64 }}
          AURA_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $version = Get-Content "VERSION.json" -Raw | ConvertFrom-Json
          .\scripts\sign-windows.ps1 -Path @("release\QuanticStudio-Setup-$($version.studio).exe")

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $version = Get-Content "VERSION.json" -Raw | ConvertFrom-Json
          $installer = "release\QuanticStudio-Setup-$($version.studio).exe"
          if (-not (Test-Path $installer)) {
            throw "Installateur Quantic Studio absent."
          }
          if ((Get-Item $installer).Length -lt 1000000) {
            throw "Installateur Quantic Studio anormalement petit."
          }
          if (-not (Select-String -Path "installer\QuanticStudio.iss" -Pattern "uninsneveruninstall" -Quiet)) {
            throw "L'installateur ne protege pas les donnees utilisateur."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: QuanticStudio-Setup
          path: release/QuanticStudio-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: QuanticStudio-Windows-Native
          path: dist/QuanticStudio
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
