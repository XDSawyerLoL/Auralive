name: Build Quantic Studio Windows app

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "engine/quantic-live/**"
      - "config/**"
      - "scripts/build-windows.ps1"
      - "scripts/install-aura-ffmpeg.ps1"
      - "scripts/build-installer.ps1"
      - "scripts/sign-windows.ps1"
      - "installer/**"
      - "requirements*.txt"
      - ".env.example"
      - ".github/workflows/build-windows-app.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "engine/quantic-live/**"
      - "config/**"
      - "scripts/build-windows.ps1"
      - "scripts/install-aura-ffmpeg.ps1"
      - "scripts/build-installer.ps1"
      - "scripts/sign-windows.ps1"
      - "installer/**"
      - "requirements*.txt"
      - ".env.example"
      - ".github/workflows/build-windows-app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/quantic-live

      - name: Build Quantic Studio Core engine
        shell: pwsh
        run: cargo build --release --manifest-path engine/quantic-live/Cargo.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app

      - name: Build QuanticStudio.exe
        shell: pwsh
        run: .\scripts\build-windows.ps1 -Python python

      - name: Bundle FFmpeg with Windows Graphics Capture
        shell: pwsh
        run: .\scripts\install-aura-ffmpeg.ps1 -Destination "dist\QuanticStudio\ffmpeg"

      - name: Embed Quantic Studio Core
        shell: pwsh
        run: |
          $engine = "engine\quantic-live\target\release\quantic-live.exe"
          if (-not (Test-Path $engine)) {
            throw "Le moteur natif compile est introuvable: $engine"
          }
          Copy-Item $engine "dist\QuanticStudio\AuraNativeBroadcast.exe" -Force

      - name: Sign Quantic Studio binaries when certificate is configured
        shell: pwsh
        env:
          AURA_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_BASE64 }}
          AURA_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          .\scripts\sign-windows.ps1 -Path @(
            "dist\QuanticStudio\QuanticStudio.exe",
            "dist\QuanticStudio\AuraNativeBroadcast.exe"
          )


      - name: Verify Windows package
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\QuanticStudio\QuanticStudio.exe")) {
            throw "QuanticStudio.exe est absent du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\BUILD-ID.txt")) {
            throw "BUILD-ID.txt est absent du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\AuraNativeBroadcast.exe")) {
            throw "AuraNativeBroadcast.exe est absent du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\ffmpeg\ffmpeg.exe")) {
            throw "Le FFmpeg Aura embarque est absent du package."
          }
          $filters = & "dist\QuanticStudio\ffmpeg\ffmpeg.exe" -hide_banner -filters 2>&1 | Out-String
          if ($filters -notmatch "\bgfxcapture\b") {
            throw "Le FFmpeg livre ne contient pas gfxcapture."
          }
          $buildId = (Get-Content "dist\QuanticStudio\BUILD-ID.txt" -Raw).Trim()
          if ($buildId -ne "QuanticStudio-2.7.4-Windows-Native-2026-09-20") {
            throw "Identifiant de build inattendu: $buildId"
          }
          if (-not (Test-Path "dist\QuanticStudio\.env")) {
            throw "La configuration locale .env est absente du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\_internal\app\web\templates\setup.html")) {
            throw "L'ecran de configuration locale Twitch est absent du package."
          }
          if (-not (Test-Path "dist\QuanticStudio\_internal\app\web\static\avatar-test-fast.js")) {
            throw "Le test vocal autonome n'est pas embarque dans le package."
          }
          if (-not (Test-Path "dist\QuanticStudio\_internal\app\web\static\aura-studio.js")) {
            throw "Le controleur Aura Studio n'est pas embarque dans le package."
          }
          if (-not (Test-Path "dist\QuanticStudio\_internal\app\web\static\aura-studio.css")) {
            throw "Le theme glossy Aura Studio n'est pas embarque dans le package."
          }
          if (-not (Test-Path "dist\QuanticStudio\_internal\app\web\static\update-center.js")) {
            throw "Le centre de mise a jour n'est pas embarque dans le package."
          }
          $envContent = Get-Content "dist\QuanticStudio\.env" -Raw
          if ($envContent -notmatch "AI_MODE=ollama" -or
              $envContent -notmatch "AI_MODEL=gemma3:12b" -or
              $envContent -notmatch "AI_AUTO_FAST_MODEL=false" -or
              $envContent -notmatch "MAIRAIY_KOKORO_VOICE=ff_siwis") {
            throw "Le .env livre n'est pas configure en Ollama qualite + Kokoro ff_siwis."
          }
          $model = Get-Item "dist\QuanticStudio\data\voices\kokoro\kokoro-v1.0.onnx" -ErrorAction Stop
          $voices = Get-Item "dist\QuanticStudio\data\voices\kokoro\voices-v1.0.bin" -ErrorAction Stop
          if ($model.Length -lt 250000000) {
            throw "Le modele Kokoro livre est incomplet: $($model.Length) octets."
          }
          if ($voices.Length -lt 10000000) {
            throw "Le pack de voix Kokoro livre est incomplet: $($voices.Length) octets."
          }
          $forbidden = Get-ChildItem "dist\QuanticStudio" -Recurse -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -eq "Python.Runtime.dll" -or $_.FullName -match "[\\/]pythonnet[\\/]"
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Host $_.FullName }
            throw "Le package contient encore pythonnet/Python.Runtime.dll."
          }

      - name: Smoke test QuanticStudio.exe startup, standalone Kokoro voice and setup UX
        shell: pwsh
        env:
          AURA_PORT: "18787"
          AURA_PUBLIC_BASE_URL: "http://localhost:18787"
          TWITCH_REDIRECT_URI: "http://localhost:18787/auth/callback"
          AI_MODE: "off"
          OBS_AUTO_CONNECT: "false"
          MAIRAIY_KOKORO_PRIMARY: "true"
          MAIRAIY_KOKORO_ENABLED: "true"
          MAIRAIY_KOKORO_AUTO_DOWNLOAD: "false"
          MAIRAIY_KOKORO_VOICE: "ff_siwis"
          MAIRAIY_KOKORO_LANGUAGE: "fr-fr"
        run: |
          $logPath = "dist\QuanticStudio\QuanticStudio-startup.log"
          if (Test-Path $logPath) { Remove-Item $logPath -Force }
          $process = Start-Process "dist\QuanticStudio\QuanticStudio.exe" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                throw "QuanticStudio.exe s'est ferme pendant le demarrage (code $($process.ExitCode))."
              }
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:18787/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              throw "QuanticStudio.exe n'a pas expose /health dans le delai imparti."
            }

            if (-not (Test-Path $logPath)) {
              throw "QuanticStudio-startup.log n'a pas ete cree."
            }
            $startup = Get-Content $logPath -Raw
            if ($startup -notmatch "QuanticStudio-2.7.4-Windows-Native-2026-09-20") {
              throw "Le binaire lance n'est pas le build FastVoiceOAuth attendu."
            }
            if ($startup -notmatch "stdout=ok" -or $startup -notmatch "stderr=ok") {
              Get-Content $logPath
              throw "Le bootloader console ne fournit pas de vrais stdout/stderr."
            }
            if ($startup -match "Unable to configure formatter") {
              Get-Content $logPath
              throw "Le formatter Uvicorn default a encore plante."
            }

            $kokoroDeadline = (Get-Date).AddSeconds(90)
            $kokoroReady = $false
            while ((Get-Date) -lt $kokoroDeadline) {
              if ($process.HasExited) {
                throw "QuanticStudio.exe s'est ferme pendant le chargement Kokoro."
              }
              try {
                $voiceResponse = Invoke-RestMethod "http://127.0.0.1:18787/api/voice/status" -TimeoutSec 3
                $kokoro = $voiceResponse.audio.kokoro_voice
                $identity = $voiceResponse.audio.voice_identity
                if ($kokoro.ready -eq $true -and
                    $kokoro.voice -eq "ff_siwis" -and
                    $identity.primary_engine -eq "kokoro-local" -and
                    $identity.primary_voice -eq "ff_siwis") {
                  $kokoroReady = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 750
            }
            if (-not $kokoroReady) {
              try {
                $voiceResponse = Invoke-RestMethod "http://127.0.0.1:18787/api/voice/status" -TimeoutSec 3
                $voiceResponse.audio | ConvertTo-Json -Depth 8 | Write-Host
              } catch {}
              Get-Content $logPath
              throw "Kokoro ff_siwis n'est pas pret dans le binaire Windows livre."
            }
            if ($voiceResponse.gemini_required -ne $false) {
              throw "Le panneau vocal indique encore que Gemini est requis."
            }

            # Test reel du bouton vocal: aucune Browser Source OBS n'est ouverte ici.
            $voiceTestBody = @{ text = "Bonjour Sansa, test vocal local." } | ConvertTo-Json
            $voiceTest = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18787/api/avatar/test" `
              -Method Post `
              -ContentType "application/json" `
              -Body $voiceTestBody `
              -TimeoutSec 30
            if ($voiceTest.ok -ne $true -or
                $voiceTest.overlay_required -ne $false -or
                $voiceTest.engine -ne "kokoro-local" -or
                -not $voiceTest.audio_url) {
              $voiceTest | ConvertTo-Json -Depth 6 | Write-Host
              throw "Le test vocal autonome n'a pas produit Kokoro sans OBS."
            }
            $audioPath = Join-Path $env:TEMP "aura-live-smoke-voice.wav"
            Invoke-WebRequest "http://127.0.0.1:18787$($voiceTest.audio_url)" -OutFile $audioPath -UseBasicParsing -TimeoutSec 10
            if ((Get-Item $audioPath).Length -le 44) {
              throw "Le test vocal autonome a produit un WAV vide."
            }
            Remove-Item $audioPath -Force -ErrorAction SilentlyContinue

            $dashboard = Invoke-WebRequest "http://127.0.0.1:18787/" -UseBasicParsing -TimeoutSec 5
            if ($dashboard.Content -notmatch "avatar-test-fast.js") {
              throw "Le dashboard n'active pas le lecteur vocal autonome."
            }
            if ($dashboard.Content -notmatch "aura-studio.js" -or $dashboard.Content -notmatch "Quantic Studio") {
              throw "Le nouveau Studio glossy n'est pas charge par le dashboard."
            }

            $updateStatus = Invoke-RestMethod "http://127.0.0.1:18787/api/update/status" -TimeoutSec 3
            if ($updateStatus.current_version -ne "2.7.4") {
              $updateStatus | ConvertTo-Json -Depth 6 | Write-Host
              throw "Le centre de mise a jour n'annonce pas Quantic Studio 2.7.4."
            }

            $broadcastStatus = Invoke-RestMethod "http://127.0.0.1:18787/api/broadcast/status" -TimeoutSec 3
            if ($broadcastStatus.mode -ne "native" -or $broadcastStatus.engine_available -ne $true) {
              $broadcastStatus | ConvertTo-Json -Depth 8 | Write-Host
              throw "Quantic Studio Core doit etre le moteur livre par defaut."
            }

            $nativeDeadline = (Get-Date).AddSeconds(15)
            $nativeReady = $false
            while ((Get-Date) -lt $nativeDeadline) {
              try {
                $nativeStatus = Invoke-RestMethod "http://127.0.0.1:18787/api/broadcast/status" -TimeoutSec 3
                if ($nativeStatus.responsive -eq $true -and
                    $nativeStatus.engine.version -eq "0.4.1" -and
                    $nativeStatus.engine.ffmpeg_ok -eq $true -and
                    $nativeStatus.engine.capture_backend -eq "Windows Graphics Capture" -and
                    $nativeStatus.system_audio.backend_present -eq $true) {
                  $nativeReady = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 400
            }
            if (-not $nativeReady) {
              try { $nativeStatus | ConvertTo-Json -Depth 10 | Write-Host } catch {}
              throw "Quantic Studio Core 0.4.1 n'a pas demarre avec FFmpeg gfxcapture embarque."
            }

            $vaultSecret = "AURA-CI-SECRET-NOT-REAL"
            $vaultBody = @{
              rtmp_url = "rtmp://live.twitch.tv/app"
              stream_key = $vaultSecret
            } | ConvertTo-Json
            $vault = Invoke-RestMethod -Uri "http://127.0.0.1:18787/api/broadcast/output" -Method Put -ContentType "application/json" -Body $vaultBody -TimeoutSec 20
            if ($vault.stream_key_configured -ne $true -or $vault.vault -ne "windows-dpapi") {
              $vault | ConvertTo-Json -Depth 8 | Write-Host
              throw "Le coffre RTMP DPAPI n'a pas enregistre la cle."
            }

            $vaultPath = "dist\QuanticStudio\data\native_broadcast\stream-key.dpapi"
            $engineConfigPath = "dist\QuanticStudio\data\native_broadcast\engine.json"
            if (-not (Test-Path $vaultPath)) {
              throw "Le fichier chiffre DPAPI de la cle RTMP est absent."
            }
            if (-not (Test-Path $engineConfigPath)) {
              throw "engine.json est absent apres configuration RTMP."
            }
            $engineConfigText = Get-Content $engineConfigPath -Raw
            if ($engineConfigText -match [regex]::Escape($vaultSecret)) {
              throw "La cle RTMP apparait en clair dans engine.json."
            }
            $engineConfig = $engineConfigText | ConvertFrom-Json
            if ([string]$engineConfig.settings.stream_key -ne "") {
              throw "Le champ stream_key persiste encore dans engine.json."
            }

            $clearVaultBody = @{
              rtmp_url = "rtmp://live.twitch.tv/app"
              clear_stream_key = $true
            } | ConvertTo-Json
            $clearedVault = Invoke-RestMethod -Uri "http://127.0.0.1:18787/api/broadcast/output" -Method Put -ContentType "application/json" -Body $clearVaultBody -TimeoutSec 20
            if ($clearedVault.stream_key_configured -ne $false -or (Test-Path $vaultPath)) {
              throw "La suppression de la cle RTMP du coffre local a echoue."
            }

            $obsFallback = Invoke-RestMethod -Uri "http://127.0.0.1:18787/api/broadcast/mode/obs" -Method Post -TimeoutSec 15
            if ($obsFallback.mode -ne "obs") {
              throw "Le mode de compatibilite OBS ne peut pas etre active."
            }
            $nativeReturn = Invoke-RestMethod -Uri "http://127.0.0.1:18787/api/broadcast/mode/native" -Method Post -TimeoutSec 15
            if ($nativeReturn.mode -ne "native") {
              throw "Impossible de revenir a Quantic Studio Core apres le fallback OBS."
            }

            $setupStatus = Invoke-RestMethod "http://127.0.0.1:18787/api/setup/status" -TimeoutSec 3
            if ($setupStatus.gemini_required -ne $false -or $setupStatus.kokoro.ready -ne $true) {
              $setupStatus | ConvertTo-Json -Depth 8 | Write-Host
              throw "Le statut de configuration locale est incoherent."
            }
            $setupPage = Invoke-WebRequest "http://127.0.0.1:18787/auth/twitch/bot" -UseBasicParsing -MaximumRedirection 5 -TimeoutSec 5
            if ($setupPage.Content -notmatch "Configuration locale" -or $setupPage.Content -match "Renseigne TWITCH_CLIENT_ID") {
              throw "L'absence d'identifiants Twitch affiche encore l'ancienne erreur brute."
            }

            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "QuanticStudio.exe s'est ferme juste apres l'ouverture de Chromium (code $($process.ExitCode))."
            }
            $stable = Invoke-WebRequest "http://127.0.0.1:18787/health" -UseBasicParsing -TimeoutSec 3
            if ($stable.StatusCode -ne 200) {
              throw "Le backend Quantic Studio n'est plus disponible apres l'ouverture de la fenetre."
            }
            $startup = Get-Content $logPath -Raw
            if ($startup -match "Unable to configure formatter") {
              Get-Content $logPath
              throw "Le formatter Uvicorn default a plante apres le demarrage."
            }
            Write-Host "Valide: OAuth externe codepath, voix Kokoro sans OBS, dashboard audio autonome, backend stable."
          } finally {
            if (-not $process.HasExited) {
              try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
            }
            $global:LASTEXITCODE = 0
          }

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
          }

      - name: Build Windows installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version "2.7.4" -SourceDir "dist\QuanticStudio"

      - name: Sign installer when certificate is configured
        shell: pwsh
        env:
          AURA_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_BASE64 }}
          AURA_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: .\scripts\sign-windows.ps1 -Path @("release\QuanticStudio-Setup-2.7.4.exe")

      - name: Verify Windows installer
        shell: pwsh
        run: |
          if (-not (Test-Path "release\QuanticStudio-Setup-2.7.4.exe")) {
            throw "Installateur Quantic Studio absent."
          }
          if ((Get-Item "release\QuanticStudio-Setup-2.7.4.exe").Length -lt 1000000) {
            throw "Installateur Quantic Studio anormalement petit."
          }
          if (-not (Select-String -Path "installer\QuanticStudio.iss" -Pattern "uninsneveruninstall" -Quiet)) {
            throw "L'installateur ne protege pas les donnees utilisateur."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: QuanticStudio-Setup-2.7.4
          path: release/QuanticStudio-Setup-2.7.4.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: QuanticStudio-Windows-Native-2.7.4
          path: dist/QuanticStudio
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
