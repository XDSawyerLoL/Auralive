name: Build Aura Live Windows app

on:
  push:
    branches:
      - feature/windows-desktop-app
      - main
    paths:
      - "app/**"
      - "config/**"
      - "scripts/build-windows.ps1"
      - "requirements*.txt"
      - ".github/workflows/build-windows-app.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app

      - name: Build AuraLive.exe
        shell: pwsh
        run: .\scripts\build-windows.ps1 -Python python

      - name: Verify Windows package
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AuraLive\AuraLive.exe")) {
            throw "AuraLive.exe est absent du package."
          }
          $forbidden = Get-ChildItem "dist\AuraLive" -Recurse -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -eq "Python.Runtime.dll" -or $_.FullName -match "[\\/]pythonnet[\\/]"
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Host $_.FullName }
            throw "Le package contient encore pythonnet/Python.Runtime.dll."
          }

      - name: Smoke test AuraLive.exe startup
        shell: pwsh
        env:
          AURA_PORT: "18787"
          AURA_PUBLIC_BASE_URL: "http://localhost:18787"
          TWITCH_REDIRECT_URI: "http://localhost:18787/auth/callback"
          AI_MODE: "off"
          OBS_AUTO_CONNECT: "false"
        run: |
          $process = Start-Process "dist\AuraLive\AuraLive.exe" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                throw "AuraLive.exe s'est ferme pendant le demarrage (code $($process.ExitCode))."
              }
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:18787/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match "Aura Live") {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              throw "AuraLive.exe n'a pas expose /health dans le delai imparti."
            }
            Write-Host "AuraLive.exe a demarre et /health repond correctement."

            # Regression test for Chromium process handoff: the launcher must remain
            # alive after the initial browser bootstrap PID has had time to detach.
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "AuraLive.exe s'est ferme juste apres l'ouverture de Chromium (code $($process.ExitCode))."
            }
            $stable = Invoke-WebRequest "http://127.0.0.1:18787/health" -UseBasicParsing -TimeoutSec 3
            if ($stable.StatusCode -ne 200 -or $stable.Content -notmatch "Aura Live") {
              throw "Le backend Aura Live n'est plus disponible apres l'ouverture de la fenetre."
            }
            Write-Host "AuraLive.exe reste actif et /health repond encore apres 8 secondes."
          } finally {
            if (-not $process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
            }
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AuraLive-Windows
          path: dist/AuraLive
          if-no-files-found: error
          retention-days: 30
