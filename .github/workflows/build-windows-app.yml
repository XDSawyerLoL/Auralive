name: Build Aura Live Windows app

on:
  push:
    branches:
      - feature/windows-desktop-app
      - main
      - feat/kokoro-primary-voice
      - fix/local-voice-status-and-twitch-setup
      - fix/mairaiy-natural-reactions
    paths:
      - "app/**"
      - "config/**"
      - "scripts/build-windows.ps1"
      - "requirements*.txt"
      - ".env.example"
      - ".github/workflows/build-windows-app.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app

      - name: Build AuraLive.exe
        shell: pwsh
        run: .\scripts\build-windows.ps1 -Python python

      - name: Verify Windows package
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AuraLive\AuraLive.exe")) {
            throw "AuraLive.exe est absent du package."
          }
          if (-not (Test-Path "dist\AuraLive\BUILD-ID.txt")) {
            throw "BUILD-ID.txt est absent du package."
          }
          $buildId = (Get-Content "dist\AuraLive\BUILD-ID.txt" -Raw).Trim()
          if ($buildId -ne "AuraLive-2.5-Windows-NaturalMairaiy-2026-09-05") {
            throw "Identifiant de build inattendu: $buildId"
          }
          if (-not (Test-Path "dist\AuraLive\.env")) {
            throw "La configuration locale .env est absente du package."
          }
          if (-not (Test-Path "dist\AuraLive\_internal\app\web\templates\setup.html")) {
            throw "L'ecran de configuration locale Twitch est absent du package."
          }
          $envContent = Get-Content "dist\AuraLive\.env" -Raw
          if ($envContent -notmatch "AI_MODE=ollama" -or
              $envContent -notmatch "AI_MODEL=gemma3:12b" -or
              $envContent -notmatch "AI_AUTO_FAST_MODEL=false" -or
              $envContent -notmatch "MAIRAIY_KOKORO_VOICE=ff_siwis") {
            throw "Le .env livre n'est pas configure en Ollama qualite + Kokoro ff_siwis."
          }
          $model = Get-Item "dist\AuraLive\data\voices\kokoro\kokoro-v1.0.onnx" -ErrorAction Stop
          $voices = Get-Item "dist\AuraLive\data\voices\kokoro\voices-v1.0.bin" -ErrorAction Stop
          if ($model.Length -lt 250000000) {
            throw "Le modele Kokoro livre est incomplet: $($model.Length) octets."
          }
          if ($voices.Length -lt 10000000) {
            throw "Le pack de voix Kokoro livre est incomplet: $($voices.Length) octets."
          }
          $forbidden = Get-ChildItem "dist\AuraLive" -Recurse -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -eq "Python.Runtime.dll" -or $_.FullName -match "[\\/]pythonnet[\\/]"
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Host $_.FullName }
            throw "Le package contient encore pythonnet/Python.Runtime.dll."
          }

      - name: Smoke test AuraLive.exe startup, Kokoro and setup UX
        shell: pwsh
        env:
          AURA_PORT: "18787"
          AURA_PUBLIC_BASE_URL: "http://localhost:18787"
          TWITCH_REDIRECT_URI: "http://localhost:18787/auth/callback"
          AI_MODE: "off"
          OBS_AUTO_CONNECT: "false"
          MAIRAIY_KOKORO_PRIMARY: "true"
          MAIRAIY_KOKORO_ENABLED: "true"
          MAIRAIY_KOKORO_AUTO_DOWNLOAD: "false"
          MAIRAIY_KOKORO_VOICE: "ff_siwis"
          MAIRAIY_KOKORO_LANGUAGE: "fr-fr"
        run: |
          $logPath = "dist\AuraLive\AuraLive-startup.log"
          if (Test-Path $logPath) { Remove-Item $logPath -Force }
          $process = Start-Process "dist\AuraLive\AuraLive.exe" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                throw "AuraLive.exe s'est ferme pendant le demarrage (code $($process.ExitCode))."
              }
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:18787/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match "Aura Live") {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              throw "AuraLive.exe n'a pas expose /health dans le delai imparti."
            }

            if (-not (Test-Path $logPath)) {
              throw "AuraLive-startup.log n'a pas ete cree."
            }
            $startup = Get-Content $logPath -Raw
            if ($startup -notmatch "AuraLive-2.5-Windows-NaturalMairaiy-2026-09-05") {
              throw "Le binaire lance n'est pas le build NaturalMairaiy attendu."
            }
            if ($startup -notmatch "stdout=ok" -or $startup -notmatch "stderr=ok") {
              Get-Content $logPath
              throw "Le bootloader console ne fournit pas de vrais stdout/stderr."
            }
            if ($startup -match "Unable to configure formatter") {
              Get-Content $logPath
              throw "Le formatter Uvicorn default a encore plante."
            }

            $kokoroDeadline = (Get-Date).AddSeconds(90)
            $kokoroReady = $false
            while ((Get-Date) -lt $kokoroDeadline) {
              if ($process.HasExited) {
                throw "AuraLive.exe s'est ferme pendant le chargement Kokoro."
              }
              try {
                $voiceResponse = Invoke-RestMethod "http://127.0.0.1:18787/api/voice/status" -TimeoutSec 3
                $kokoro = $voiceResponse.audio.kokoro_voice
                $identity = $voiceResponse.audio.voice_identity
                if ($kokoro.ready -eq $true -and
                    $kokoro.voice -eq "ff_siwis" -and
                    $identity.primary_engine -eq "kokoro-local" -and
                    $identity.primary_voice -eq "ff_siwis") {
                  $kokoroReady = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 750
            }
            if (-not $kokoroReady) {
              try {
                $voiceResponse = Invoke-RestMethod "http://127.0.0.1:18787/api/voice/status" -TimeoutSec 3
                $voiceResponse.audio | ConvertTo-Json -Depth 8 | Write-Host
              } catch {}
              Get-Content $logPath
              throw "Kokoro ff_siwis n'est pas pret dans le binaire Windows livre."
            }
            if ($voiceResponse.gemini_required -ne $false) {
              throw "Le panneau vocal indique encore que Gemini est requis."
            }

            $setupStatus = Invoke-RestMethod "http://127.0.0.1:18787/api/setup/status" -TimeoutSec 3
            if ($setupStatus.gemini_required -ne $false -or $setupStatus.kokoro.ready -ne $true) {
              $setupStatus | ConvertTo-Json -Depth 8 | Write-Host
              throw "Le statut de configuration locale est incoherent."
            }
            $setupPage = Invoke-WebRequest "http://127.0.0.1:18787/auth/twitch/bot" -UseBasicParsing -MaximumRedirection 5 -TimeoutSec 5
            if ($setupPage.Content -notmatch "Configuration locale" -or $setupPage.Content -match "Renseigne TWITCH_CLIENT_ID") {
              throw "L'absence d'identifiants Twitch affiche encore l'ancienne erreur brute."
            }

            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "AuraLive.exe s'est ferme juste apres l'ouverture de Chromium (code $($process.ExitCode))."
            }
            $stable = Invoke-WebRequest "http://127.0.0.1:18787/health" -UseBasicParsing -TimeoutSec 3
            if ($stable.StatusCode -ne 200 -or $stable.Content -notmatch "Aura Live") {
              throw "Le backend Aura Live n'est plus disponible apres l'ouverture de la fenetre."
            }
            $startup = Get-Content $logPath -Raw
            if ($startup -match "Unable to configure formatter") {
              Get-Content $logPath
              throw "Le formatter Uvicorn default a plante apres le demarrage."
            }
            Write-Host "Valide: Natural Mairaiy, Kokoro ff_siwis, setup Twitch local, backend stable."
          } finally {
            if (-not $process.HasExited) {
              try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
            }
            $global:LASTEXITCODE = 0
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AuraLive-Windows-NaturalMairaiy
          path: dist/AuraLive
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
