name: Build Quantic Glide Android APK

on:
  pull_request:
    paths:
      - "mobile/glide-android/**"
      - ".github/workflows/build-glide-android.yml"
  push:
    branches: [main]
    paths:
      - "mobile/glide-android/**"
      - ".github/workflows/build-glide-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed debug APK
        working-directory: mobile/glide-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="mobile/glide-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK"
          mkdir -p build/glide-android
          cp "$APK" build/glide-android/Quantic-Glide-Android-1.3.0-beta.apk
          sha256sum build/glide-android/Quantic-Glide-Android-1.3.0-beta.apk > build/glide-android/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Quantic-Glide-Android-1.3.0-beta
          path: build/glide-android/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK into AURA downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p downloads
          cp build/glide-android/Quantic-Glide-Android-1.3.0-beta.apk downloads/Quantic-Glide-Android-1.3.0-beta.apk
          cp build/glide-android/SHA256SUMS.txt downloads/Quantic-Glide-Android-1.3.0-beta.sha256
          git config user.name "AURA Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/
          if git diff --cached --quiet; then
            echo "APK déjà publié."
            exit 0
          fi
          git commit -m "Publish Quantic Glide Android 1.3.0 beta APK [skip ci]"
          git push
