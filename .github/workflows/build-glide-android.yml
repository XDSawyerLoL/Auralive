name: Build Quantic Glide Android APK

on:
  pull_request:
    paths:
      - "mobile/glide-android/**"
      - ".github/workflows/build-glide-android.yml"
  push:
    branches: [main]
    paths:
      - "mobile/glide-android/**"
      - ".github/workflows/build-glide-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed debug APK
        working-directory: mobile/glide-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="mobile/glide-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK"
          mkdir -p build/glide-android
          cp "$APK" build/glide-android/Quantic-Glide-Android-1.3.0-beta.apk
          sha256sum build/glide-android/Quantic-Glide-Android-1.3.0-beta.apk > build/glide-android/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Quantic-Glide-Android-1.3.0-beta
          path: build/glide-android/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to Glide release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="quantic-glide-v1.3.0"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Quantic Glide 1.3.0 — AURA 2.0" --notes "Quantic Glide 1.3.0 release assets."
          fi
          gh release upload "$tag" \
            build/glide-android/Quantic-Glide-Android-1.3.0-beta.apk \
            build/glide-android/SHA256SUMS.txt \
            --clobber
