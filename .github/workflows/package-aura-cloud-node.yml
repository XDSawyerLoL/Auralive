name: Package AURA Cloud Node Hostinger

on:
  pull_request:
    paths:
      - "cloud-node/**"
      - ".github/workflows/package-aura-cloud-node.yml"
  workflow_dispatch:

jobs:
  package-node-hostinger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare clean Hostinger upload
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aura-cloud-node-hostinger"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cp -R cloud-node/src "$ROOT/src"
          cp -R cloud-node/test "$ROOT/test"
          cp cloud-node/server.js cloud-node/package.json cloud-node/.env.example cloud-node/.gitignore cloud-node/README.md cloud-node/HOSTINGER-QUICKSTART.txt "$ROOT/"
          cat > "$ROOT/DEPLOYMENT.json" <<EOF
          {
            "product": "AURA Cloud",
            "runtime": "Node.js 22 / Fastify / MySQL",
            "target": "Hostinger Node.js Web App",
            "git_sha": "$GITHUB_SHA",
            "evolution_phase": 1,
            "operator_mode": "plan-only",
            "auto_submit": false,
            "auto_merge": false
          }
          EOF
          (
            cd "$ROOT"
            zip -qr "$RUNNER_TEMP/aura-cloud-node-hostinger.zip" .
          )
      - uses: actions/upload-artifact@v4
        with:
          name: aura-cloud-node-hostinger
          path: ${{ runner.temp }}/aura-cloud-node-hostinger.zip
          retention-days: 14
          if-no-files-found: error
