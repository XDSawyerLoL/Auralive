name: Package AURA Cloud Node Hostinger

on:
  pull_request:
    paths:
      - "cloud-node/**"
      - ".github/workflows/package-aura-cloud-node.yml"
  push:
    branches:
      - main
    paths:
      - "cloud-node/**"
      - ".github/workflows/package-aura-cloud-node.yml"
  workflow_dispatch:

jobs:
  package-node-hostinger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate CORTEX 07 offline 3D fallback image
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check "numpy>=1.26,<3" "pillow>=10" "vtk>=9.3,<9.7"
          python cloud-node/scripts/generate_cortex07_brain.py cloud-node/src/assets/cortex07_brain.webp
          test -s cloud-node/src/assets/cortex07_brain.webp

      - name: Prepare clean Hostinger upload
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aura-cloud-node-hostinger"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cp -R cloud-node/src "$ROOT/src"
          cp -R cloud-node/test "$ROOT/test"
          cp -R cloud-node/scripts "$ROOT/scripts"
          cp -R cloud-node/skills "$ROOT/skills"
          cp -R cloud-node/docs "$ROOT/docs"
          cp cloud-node/server.js cloud-node/package.json cloud-node/package-lock.json cloud-node/.env.example cloud-node/.gitignore cloud-node/README.md cloud-node/HOSTINGER-QUICKSTART.txt "$ROOT/"
          PACKAGE_VERSION="$(node -p "require('./cloud-node/package.json').version")"
          cat > "$ROOT/DEPLOYMENT.json" <<EOF
          {
            "product": "AURA Cloud",
            "version": "$PACKAGE_VERSION",
            "runtime": "Node.js 22 / Fastify / MySQL",
            "target": "Hostinger Node.js Web App",
            "git_sha": "$GITHUB_SHA",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "evolution_phase": 3,
            "cognition_native": true,
            "command_center": 1,
            "autonomous_initiatives": true,
            "web_substrate": 1,
            "external_memory": true,
            "epistemic_gate": "independent-source-corroboration",
            "operator_mode": "guarded-local-worker",
            "promotion": "ci-and-canary-gated"
          }
          EOF

          test -f "$ROOT/package.json"
          test -f "$ROOT/server.js"
          test -f "$ROOT/src/server.js"
          test -f "$ROOT/src/agent_skills.js"
          test -f "$ROOT/test/agent_skills.test.js"
          test -f "$ROOT/skills/planning/SKILL.md"
          test -f "$ROOT/skills/validation/SKILL.md"
          test -f "$ROOT/docs/AURA_SKILLS.md"
          test -f "$ROOT/src/native_learning.js"
          test -f "$ROOT/src/command_center.js"
          test -f "$ROOT/src/long_horizon.js"
          test -f "$ROOT/src/web_substrate.js"
          test -f "$ROOT/src/evolution.js"
          test -f "$ROOT/test/voice_bridge.test.js"
          test -f "$ROOT/test/command_center.test.js"
          test -f "$ROOT/test/long_horizon.test.js"
          test -f "$ROOT/test/web_substrate.test.js"
          test -f "$ROOT/scripts/run-agi-audit.mjs"
          test -f "$ROOT/package-lock.json"
          test -f "$ROOT/.env.example"

          cd "$ROOT"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          rm -rf node_modules

      - name: Upload Hostinger-ready project root
        uses: actions/upload-artifact@v4
        with:
          name: aura-cloud-node-hostinger
          path: ${{ runner.temp }}/aura-cloud-node-hostinger/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
