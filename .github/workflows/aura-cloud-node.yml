name: AURA Cloud Node validation

on:
  pull_request:
    paths:
      - "cloud-node/**"
      - ".github/workflows/aura-cloud-node.yml"
  push:
    branches:
      - main
    paths:
      - "cloud-node/**"
      - ".github/workflows/aura-cloud-node.yml"
  workflow_dispatch:

jobs:
  node-cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud-node/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Allen human feature exporter (no network)
        run: python3 -m unittest discover -s scripts -p 'test_*allen*.py' -v
      - name: Syntax check
        run: npm run check
      - name: Policy tests
        run: npm test
      - name: Run falsifiable AGI capability battery
        run: npm run audit:agi -- --json=agi-audit-report.json
      - name: Upload AGI audit report
        uses: actions/upload-artifact@v4
        with:
          name: aura-agi-audit
          path: cloud-node/agi-audit-report.json
          if-no-files-found: error
      - name: Diagnostic startup smoke test
        shell: bash
        env:
          NODE_ENV: production
          PORT: "49999"
          AURA_GATEWAY_PORT: "3987"
          AURA_INTERNAL_PORT: "3988"
        run: |
          set -euo pipefail
          node server.js > /tmp/aura-cloud.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:49999/ > /tmp/aura-dashboard.html; then
              break
            fi
            sleep 0.5
          done
          grep -q 'Cartographie cognitive d' /tmp/aura-dashboard.html
          grep -q 'id="graphCanvas"' /tmp/aura-dashboard.html
          grep -q 'id="chatInput"' /tmp/aura-dashboard.html
          grep -q 'id="chatMode"' /tmp/aura-dashboard.html
          curl -fsS http://127.0.0.1:49999/cerveau > /tmp/aura-neural.html
          grep -q 'id="graphCanvas"' /tmp/aura-neural.html
          curl -fsS http://127.0.0.1:49999/api/brain/graph > /tmp/aura-brain-graph.json
          grep -q '"version":"brain-flow-v1"' /tmp/aura-brain-graph.json
          curl -fsS http://127.0.0.1:49999/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:49999/api/bootstrap/status | grep -q '"server_ready":true'
      - name: Dependency production tree
        run: npm ls --omit=dev
