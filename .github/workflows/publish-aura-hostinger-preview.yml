name: Publish AURA Hostinger preview ZIP

on:
  push:
    branches:
      - fix/aura-dialogue-context-causal-gate-20261112
    paths:
      - ".github/workflows/publish-aura-hostinger-preview.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish-preview:
    if: github.repository == 'XDSawyerLoL/Auralive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve tested canonical Hostinger artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aura-preview"
          gh run download 43263702275 --repo "$GITHUB_REPOSITORY" --name aura-cloud-hostinger --dir "$RUNNER_TEMP/aura-preview"
          test -f "$RUNNER_TEMP/aura-preview/server.js"
          test -f "$RUNNER_TEMP/aura-preview/package.json"
          test -f "$RUNNER_TEMP/aura-preview/DEPLOYMENT.json"
          test -f "$RUNNER_TEMP/aura-preview/test/endophasia_developmental_causality.test.js"
          test -f "$RUNNER_TEMP/aura-preview/docs/AURA_DEVELOPMENTAL_CAUSAL_AUDIT_20261112.md"
          test -f "$RUNNER_TEMP/aura-preview/src/biophysical_microcircuit.js"
          test -f "$RUNNER_TEMP/aura-preview/src/human_ephys_calibration.js"
          test -f "$RUNNER_TEMP/aura-preview/scripts/export_allen_human_features.py"
          test -f "$RUNNER_TEMP/aura-preview/test/human_ephys_calibration.test.js"
          test -f "$RUNNER_TEMP/aura-preview/docs/AURA_EMULATION_BIOPHYSIQUE_CERVEAU_CORPS_20261112.md"
          test -f "$RUNNER_TEMP/aura-preview/src/biophysical_morphology.js"
          test -f "$RUNNER_TEMP/aura-preview/src/biophysical_synapses.js"
          test -f "$RUNNER_TEMP/aura-preview/scripts/allen_human_active_models.py"
          test -f "$RUNNER_TEMP/aura-preview/scripts/run_verified_allen_model.py"
          test -f "$RUNNER_TEMP/aura-preview/scripts/run_human_swc_neuron.py"
          test -f "$RUNNER_TEMP/aura-preview/test/biophysical_morphology_synapses.test.js"
          grep -q 'magnesiumUnblock' "$RUNNER_TEMP/aura-preview/src/biophysical_synapses.js"
          grep -q 'advancePassiveArbor' "$RUNNER_TEMP/aura-preview/src/biophysical_morphology.js"
          grep -q 'source_authenticity_verified_by_server:false' "$RUNNER_TEMP/aura-preview/src/human_ephys_calibration.js"
          grep -q 'runMicrocircuit' "$RUNNER_TEMP/aura-preview/src/biophysical_microcircuit.js"
          # Pull-request packaging records GitHub's synthetic merge SHA.
          # Require the exact tested artifact's value, not the PR head SHA.
          grep -q '"git_sha": "be6b27c817b9fb985889b7e87a5ecc17fa0ddb25"' "$RUNNER_TEMP/aura-preview/DEPLOYMENT.json"
          grep -q 'semantic_intent' "$RUNNER_TEMP/aura-preview/src/inner_dialogue.js"
          grep -q 'observeSocialFeedback' "$RUNNER_TEMP/aura-preview/src/organism.js"
      - name: Pack immutable Hostinger-ready ZIP
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/aura-preview" && zip -q -r "$GITHUB_WORKSPACE/AURA_CERVEAU_BIOPHYSIQUE_SWC_20261112.zip" .)
          unzip -t "$GITHUB_WORKSPACE/AURA_CERVEAU_BIOPHYSIQUE_SWC_20261112.zip" | tail -n 1
          sha256sum "$GITHUB_WORKSPACE/AURA_CERVEAU_BIOPHYSIQUE_SWC_20261112.zip"
      - name: Publish binary in dedicated distribution branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DISTRIBUTION_BRANCH="distribution/aura-bio-20261112"
          ARCHIVE="AURA_CERVEAU_BIOPHYSIQUE_SWC_20261112.zip"
          SOURCE_SHA="a75dd22644b2b0795fe68d1d41fdf7d1f2daed6a"
          test -s "$GITHUB_WORKSPACE/$ARCHIVE"
          cd "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin "refs/heads/$DISTRIBUTION_BRANCH"
          git checkout -B "$DISTRIBUTION_BRANCH" FETCH_HEAD
          mkdir -p downloads
          cp "$GITHUB_WORKSPACE/$ARCHIVE" "downloads/$ARCHIVE"
          git add "downloads/$ARCHIVE"
          git -c user.name="AURA CI" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "distribution(aura): tested human SWC morphology + synaptic physiology; source $SOURCE_SHA"
          git push origin "HEAD:refs/heads/$DISTRIBUTION_BRANCH"
          sha256sum "downloads/$ARCHIVE"
