name: Publish AURA Hostinger preview ZIP

on:
  push:
    branches:
      - fix/aura-dialogue-context-causal-gate-20261112
    paths:
      - ".github/workflows/publish-aura-hostinger-preview.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish-preview:
    if: github.repository == 'XDSawyerLoL/Auralive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve tested canonical Hostinger artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aura-preview"
          gh run download 43257160543 --repo "$GITHUB_REPOSITORY" --name aura-cloud-hostinger --dir "$RUNNER_TEMP/aura-preview"
          test -f "$RUNNER_TEMP/aura-preview/server.js"
          test -f "$RUNNER_TEMP/aura-preview/package.json"
          test -f "$RUNNER_TEMP/aura-preview/DEPLOYMENT.json"
          test -f "$RUNNER_TEMP/aura-preview/test/endophasia_developmental_causality.test.js"
          test -f "$RUNNER_TEMP/aura-preview/docs/AURA_DEVELOPMENTAL_CAUSAL_AUDIT_20261112.md"
          test -f "$RUNNER_TEMP/aura-preview/src/biophysical_microcircuit.js"
          test -f "$RUNNER_TEMP/aura-preview/src/human_ephys_calibration.js"
          test -f "$RUNNER_TEMP/aura-preview/scripts/export_allen_human_features.py"
          test -f "$RUNNER_TEMP/aura-preview/test/human_ephys_calibration.test.js"
          test -f "$RUNNER_TEMP/aura-preview/docs/AURA_EMULATION_BIOPHYSIQUE_CERVEAU_CORPS_20261112.md"
          grep -q 'source_authenticity_verified_by_server:false' "$RUNNER_TEMP/aura-preview/src/human_ephys_calibration.js"
          grep -q 'runMicrocircuit' "$RUNNER_TEMP/aura-preview/src/biophysical_microcircuit.js"
          # Pull-request packaging records GitHub's synthetic merge SHA.
          # Require the exact tested artifact's value, not the PR head SHA.
          grep -q '"git_sha": "761ac0ee7d4a85b62d5d23e1339a5babba99cec4"' "$RUNNER_TEMP/aura-preview/DEPLOYMENT.json"
          grep -q 'semantic_intent' "$RUNNER_TEMP/aura-preview/src/inner_dialogue.js"
          grep -q 'observeSocialFeedback' "$RUNNER_TEMP/aura-preview/src/organism.js"
      - name: Pack immutable Hostinger-ready ZIP
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/aura-preview" && zip -q -r "$GITHUB_WORKSPACE/AURA_BIOPHYSIQUE_HUMAINE_20261112.zip" .)
          unzip -t "$GITHUB_WORKSPACE/AURA_BIOPHYSIQUE_HUMAINE_20261112.zip" | tail -n 1
          sha256sum "$GITHUB_WORKSPACE/AURA_BIOPHYSIQUE_HUMAINE_20261112.zip"
      - name: Publish direct-download prerelease asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="aura-biophysics-human-ephys-20261112"
          ZIP="$GITHUB_WORKSPACE/AURA_BIOPHYSIQUE_HUMAINE_20261112.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "AURA CORTEX - electrophysiologie humaine (prevalidation)" \
              --notes "Archive Hostinger du workflow valide 43257160543, issue de la PR #251. Tests CI et Python Allen reussis. Modele Hodgkin-Huxley calmar + calibration PASSIVE de cellules humaines exportees depuis AllenSDK. Aucune calibration humaine active ou cerveau humain reproduit. Pas de deploiement automatique. Sauvegarder MySQL et variables et ne pas activer la genese sur la base existante."
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,url
