name: AURA External Benchmarks - Frozen Public Baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'evaluation/external/**'
      - '.github/workflows/external-benchmarks.yml'

permissions:
  contents: read

jobs:
  arc-agi-2-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AURA_FROZEN_SHA: 916f8c2ac5830fa969ab5716f2251db017e53879
      ARC_AGI2_SHA: f3283f727488ad98fe575ea6a5ac981e4a188e49
    steps:
      - name: Checkout evaluation harness
        uses: actions/checkout@v4

      - name: Checkout frozen AURA
        uses: actions/checkout@v4
        with:
          repository: XDSawyerLoL/Auralive
          ref: ${{ env.AURA_FROZEN_SHA }}
          path: frozen-aura

      - name: Checkout official ARC-AGI-2 dataset
        uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-2
          ref: ${{ env.ARC_AGI2_SHA }}
          path: external/ARC-AGI-2

      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-aura rev-parse HEAD)" = "$AURA_FROZEN_SHA"
          test "$(git -C external/ARC-AGI-2 rev-parse HEAD)" = "$ARC_AGI2_SHA"
          test "$(find external/ARC-AGI-2/data/evaluation -maxdepth 1 -name '*.json' | wc -l)" -eq 120

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Evaluate frozen AURA on all public ARC-AGI-2 evaluation tasks
        run: |
          node evaluation/external/arc_agi2_public.mjs \
            --dataset external/ARC-AGI-2/data/evaluation \
            --aura-root frozen-aura \
            --out artifacts/external/arc-agi-2-public.json

      - name: Publish external evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-external-arc-agi-2-public
          path: artifacts/external/arc-agi-2-public.json
          if-no-files-found: error
