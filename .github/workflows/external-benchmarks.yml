name: AURA External Benchmarks - Current Candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'cloud-node/src/cognition.js'
      - 'cloud-node/src/dialogue_model.js'
      - 'cloud-node/src/grid_reasoning.js'
      - 'cloud-node/src/skill_learning.js'
      - 'evaluation/external/**'
      - '.github/workflows/external-benchmarks.yml'
  push:
    branches: [main]
    paths:
      - 'cloud-node/src/cognition.js'
      - 'cloud-node/src/dialogue_model.js'
      - 'cloud-node/src/grid_reasoning.js'
      - 'cloud-node/src/skill_learning.js'
      - 'evaluation/external/**'
      - '.github/workflows/external-benchmarks.yml'

permissions:
  contents: read

jobs:
  dialogue-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record evaluated AURA SHA
        run: echo "AURA_EVALUATED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Evaluate held-out multi-turn dialogue
        run: node evaluation/external/dialogue_heldout.mjs --out artifacts/external/dialogue-heldout.json
      - name: Publish dialogue evaluation
        uses: actions/upload-artifact@v4
        with:
          name: aura-dialogue-heldout
          path: artifacts/external/dialogue-heldout.json
          if-no-files-found: error

  arc-agi-2-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARC_AGI2_SHA: f3283f727488ad98fe575ea6a5ac981e4a188e49
    steps:
      - name: Checkout current AURA candidate
        uses: actions/checkout@v4

      - name: Checkout official ARC-AGI-2 dataset
        uses: actions/checkout@v4
        with:
          repository: arcprize/ARC-AGI-2
          ref: ${{ env.ARC_AGI2_SHA }}
          path: external/ARC-AGI-2

      - name: Verify immutable dataset and record evaluated SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/ARC-AGI-2 rev-parse HEAD)" = "$ARC_AGI2_SHA"
          test "$(find external/ARC-AGI-2/data/evaluation -maxdepth 1 -name '*.json' | wc -l)" -eq 120
          echo "AURA_EVALUATED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Evaluate current AURA on all public ARC-AGI-2 evaluation tasks
        run: |
          node evaluation/external/arc_agi2_public.mjs \
            --dataset external/ARC-AGI-2/data/evaluation \
            --aura-root . \
            --out artifacts/external/arc-agi-2-public.json

      - name: Publish ARC evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-external-arc-agi-2-public-current
          path: artifacts/external/arc-agi-2-public.json
          if-no-files-found: error
