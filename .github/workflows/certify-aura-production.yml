name: Certify AURA Production

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "AURA production base URL"
        required: false
        default: "https://antiquewhite-dolphin-780448.hostingersite.com"
  push:
    paths:
      - "scripts/certify-aura-production.mjs"
      - ".github/workflows/certify-aura-production.yml"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  certify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AURA_PRODUCTION_URL: ${{ inputs.base_url || 'https://antiquewhite-dolphin-780448.hostingersite.com' }}
      AURA_CERT_OUTPUT: aura-production-certification.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check certifier syntax
        run: node --check scripts/certify-aura-production.mjs
      - name: Certify live AURA Cloud
        run: node scripts/certify-aura-production.mjs
      - name: Upload certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-production-certification
          path: aura-production-certification.json
          if-no-files-found: warn
          retention-days: 30
