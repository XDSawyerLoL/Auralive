name: Package Mairaiy Gemini Aoede Hostinger

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "config/**"
      - "requirements.txt"
      - "deploy/hostinger/**"
      - ".github/workflows/package-mairaiy-aoede-hostinger.yml"
  workflow_dispatch:

jobs:
  package-mairaiy-aoede-hostinger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate historical Gemini Aoede bridge source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/main.py app/main_v2.py app/main_v3.py app/services/local_kokoro_voice.py app/services/voice_identity_lock.py
          grep -q '@app.post("/voice/v1/audio/speech")' app/main.py
          grep -q '"X-Mairaiy-Voice": "Aoede"' app/main.py
          grep -q 'locked_voice = "Aoede"' app/services/voice_identity_lock.py
          grep -q 'install_voice_identity_lock(aura)' app/main_v3.py
          grep -q '_GEMINI_TTS_DEFAULT_VOICE = "Aoede"' app/services/avatar_audio.py

      - name: Build Hostinger Python project root
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mairaiy-aoede-hostinger"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          cp -R app "$ROOT/app"
          cp -R config "$ROOT/config"
          cp -R deploy "$ROOT/deploy"
          cp -R tests "$ROOT/tests"
          cp requirements.txt pytest.ini README.md FONCTIONS.md SECURITY.md LICENSE "$ROOT/"

          cat > "$ROOT/HOSTINGER-MAIRAIY.txt" <<'EOF'
          Mairaiy exact voice service
          ---------------------------
          Runtime: Python 3.12 / FastAPI
          Start: bash deploy/hostinger/start.sh
          Engine: Kokoro ONNX
          Voice: ff_siwis
          Language: fr-fr

          Exact endpoints:
          GET  /voice/.well-known/voicestudio-speech
          GET  /voice/v1/audio/voices
          POST /voice/v1/audio/speech

          The POST endpoint uses the historical Aura Live 2.0.7 Mairaiy pipeline:
          Gemini TTS + Aoede + the natural close-mic prompt. Piper, Kokoro, Windows
          and browser TTS are not used as silent substitutions for Mairaiy.
          EOF

          test -f "$ROOT/app/main_v3.py"
          test -f "$ROOT/app/services/local_kokoro_voice.py"
          test -f "$ROOT/deploy/hostinger/start.sh"
          test -f "$ROOT/requirements.txt"

      - name: Upload Hostinger-ready Mairaiy project
        uses: actions/upload-artifact@v4
        with:
          name: mairaiy-aoede-hostinger
          path: ${{ runner.temp }}/mairaiy-aoede-hostinger/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
