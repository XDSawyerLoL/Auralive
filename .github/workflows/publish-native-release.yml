name: Publish Quantic Studio Release

on:
  push:
    branches:
      - main
    paths:
      - "VERSION.json"
      - ".github/workflows/publish-native-release.yml"
      - "app/**"
      - "cloud-node/**"
      - "engine/quantic-live/**"
      - "installer/**"
      - "scripts/build-installer.ps1"
      - "scripts/build-windows.ps1"
      - "scripts/build-windows-lite.ps1"
      - "scripts/generate-studio-icon.py"
      - "scripts/install-aura-ffmpeg.ps1"
      - "scripts/sign-windows.ps1"
      - "requirements*.txt"
      - "build-assets/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-quantic-studio-native-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read shared version manifest
        shell: pwsh
        run: |
          $version = Get-Content "VERSION.json" -Raw | ConvertFrom-Json
          "STUDIO_VERSION=$($version.studio)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NATIVE_ENGINE_VERSION=$($version.native_engine)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_DATE=$(([string]$version.updated_at).Replace('-', ''))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/quantic-live

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app tests

      - name: Build and test Quantic Studio Core
        shell: pwsh
        run: |
          cargo test --locked --manifest-path engine/quantic-live/Cargo.toml
          cargo build --release --locked --manifest-path engine/quantic-live/Cargo.toml

      - name: Prepare release directory
        shell: pwsh
        run: |
          if (Test-Path "release") { Remove-Item "release" -Recurse -Force }
          New-Item -ItemType Directory -Force "release" | Out-Null

      - name: Build full Quantic Studio
        shell: pwsh
        env:
          AURA_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_BASE64 }}
          AURA_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          .\scripts\build-windows.ps1 -Python python
          .\scripts\install-aura-ffmpeg.ps1 -Destination "dist\QuanticStudio\ffmpeg"
          Copy-Item "engine\quantic-live\target\release\quantic-live.exe" "dist\QuanticStudio\QuanticStudioCore.exe" -Force

          $expected = "QuanticStudio-$env:STUDIO_VERSION-Windows-Native-$env:BUILD_DATE"
          $buildId = (Get-Content "dist\QuanticStudio\BUILD-ID.txt" -Raw).Trim()
          if ($buildId -ne $expected) { throw "Build ID complet inattendu: $buildId (attendu: $expected)" }
          if (-not (Test-Path "dist\QuanticStudio\aura-source\cloud-node\src\cognition.js")) {
            throw "Les sources cloud-node nécessaires à AURA Evolution ne sont pas embarquées."
          }

          .\scripts\sign-windows.ps1 -Path @(
            "dist\QuanticStudio\QuanticStudio.exe",
            "dist\QuanticStudio\QuanticStudioCore.exe"
          )

          $zip = "release\QuanticStudio-Windows-Native-$env:STUDIO_VERSION.zip"
          Compress-Archive -Path "dist\QuanticStudio" -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 1000000) { throw "Archive complète anormalement petite." }

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --yes --no-progress }

      - name: Build and sign installer
        shell: pwsh
        env:
          AURA_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_BASE64 }}
          AURA_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          .\scripts\build-installer.ps1 -Version $env:STUDIO_VERSION -SourceDir "dist\QuanticStudio"
          .\scripts\sign-windows.ps1 -Path @("release\QuanticStudio-Setup-$env:STUDIO_VERSION.exe")

      - name: Build Lite Quantic Studio
        shell: pwsh
        env:
          AURA_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_BASE64 }}
          AURA_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (Test-Path "dist\QuanticStudio") { Remove-Item "dist\QuanticStudio" -Recurse -Force }
          .\scripts\build-windows-lite.ps1 -Python python
          .\scripts\install-aura-ffmpeg.ps1 -Destination "dist\QuanticStudio\ffmpeg"
          Copy-Item "engine\quantic-live\target\release\quantic-live.exe" "dist\QuanticStudio\QuanticStudioCore.exe" -Force

          $expected = "QuanticStudio-$env:STUDIO_VERSION-Windows-Native-LITE-$env:BUILD_DATE"
          $buildId = (Get-Content "dist\QuanticStudio\BUILD-ID.txt" -Raw).Trim()
          if ($buildId -ne $expected) { throw "Build ID Lite inattendu: $buildId (attendu: $expected)" }

          .\scripts\sign-windows.ps1 -Path @(
            "dist\QuanticStudio\QuanticStudio.exe",
            "dist\QuanticStudio\QuanticStudioCore.exe"
          )

          $zip = "release\QuanticStudio-Windows-Native-$env:STUDIO_VERSION-LITE.zip"
          Compress-Archive -Path "dist\QuanticStudio" -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 1000000) { throw "Archive Lite anormalement petite." }

      - name: Package standalone native engine
        shell: pwsh
        run: |
          $dir = "release\Quantic-Studio-Core-Windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "engine\quantic-live\target\release\quantic-live.exe" "$dir\QuanticStudioCore.exe" -Force
          Copy-Item "engine\quantic-live\README.md" "$dir\README-Native-Broadcast.md" -Force
          Compress-Archive -Path $dir -DestinationPath "release\Quantic-Studio-Core-Windows-x64.zip" -CompressionLevel Optimal
          Remove-Item $dir -Recurse -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem "release" -File | Where-Object { $_.Extension -in @(".zip", ".exe") } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content "release\SHA256SUMS.txt" -Encoding ascii
          Get-Content "release\SHA256SUMS.txt"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "quantic-studio-v$env:STUDIO_VERSION"
          $full = "release\QuanticStudio-Windows-Native-$env:STUDIO_VERSION.zip"
          $lite = "release\QuanticStudio-Windows-Native-$env:STUDIO_VERSION-LITE.zip"
          $engine = "release\Quantic-Studio-Core-Windows-x64.zip"
          $installer = "release\QuanticStudio-Setup-$env:STUDIO_VERSION.exe"
          $sums = "release\SHA256SUMS.txt"
          $notes = @"
          # Quantic Studio $env:STUDIO_VERSION

          Version générée depuis le manifeste unique VERSION.json.

          - Build complet : QuanticStudio-$env:STUDIO_VERSION-Windows-Native-$env:BUILD_DATE
          - Build Lite : QuanticStudio-$env:STUDIO_VERSION-Windows-Native-LITE-$env:BUILD_DATE
          - Moteur natif : $env:NATIVE_ENGINE_VERSION
          - AURA Evolution embarque désormais aussi le runtime cloud-node pour les candidats cognitifs JavaScript.
          - SHA256SUMS.txt contient les empreintes des archives et de l'installateur.
          "@

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $full $lite $engine $installer $sums --clobber --repo "${{ github.repository }}"
            gh release edit $tag --repo "${{ github.repository }}" --title "Quantic Studio $env:STUDIO_VERSION" --notes $notes --latest
          } else {
            gh release create $tag $full $lite $engine $installer $sums `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "Quantic Studio $env:STUDIO_VERSION" `
              --notes $notes `
              --latest
          }
