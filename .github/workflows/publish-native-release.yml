name: Publish Quantic Studio 2.7.4 Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-native-release.yml"
      - "app/**"
      - "engine/quantic-live/**"
      - "installer/**"
      - "scripts/build-installer.ps1"
      - "scripts/build-windows.ps1"
      - "scripts/build-windows-lite.ps1"
      - "scripts/generate-studio-icon.py"
      - "scripts/install-aura-ffmpeg.ps1"
      - "scripts/sign-windows.ps1"
      - "requirements*.txt"
      - "build-assets/**"
      - "tests/test_windows_desktop_packaging.py"
      - "tests/test_native_broadcast.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-quantic-studio-native-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/quantic-live

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app

      - name: Build Quantic Studio Core engine
        shell: pwsh
        run: cargo build --release --manifest-path engine/quantic-live/Cargo.toml

      - name: Prepare release directory
        shell: pwsh
        run: |
          if (Test-Path "release") { Remove-Item "release" -Recurse -Force }
          New-Item -ItemType Directory -Force "release" | Out-Null

      - name: Sign native engine when certificate is configured
        shell: pwsh
        env:
          AURA_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_BASE64 }}
          AURA_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: .\scripts\sign-windows.ps1 -Path @("engine\quantic-live\target\release\quantic-live.exe")

      - name: Build full Quantic Studio 2.7.4
        shell: pwsh
        env:
          AURA_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_BASE64 }}
          AURA_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          .\scripts\build-windows.ps1 -Python python
          .\scripts\install-aura-ffmpeg.ps1 -Destination "dist\QuanticStudio\ffmpeg"
          Copy-Item "engine\quantic-live\target\release\quantic-live.exe" "dist\QuanticStudio\AuraNativeBroadcast.exe" -Force

          if (-not (Test-Path "dist\QuanticStudio\QuanticStudio.exe")) { throw "QuanticStudio.exe absent du package complet." }
          if (-not (Test-Path "dist\QuanticStudio\AuraNativeBroadcast.exe")) { throw "AuraNativeBroadcast.exe absent du package complet." }
          if (-not (Test-Path "dist\QuanticStudio\ffmpeg\ffmpeg.exe")) { throw "FFmpeg Aura absent du package complet." }
          $buildId = (Get-Content "dist\QuanticStudio\BUILD-ID.txt" -Raw).Trim()
          if ($buildId -ne "QuanticStudio-2.7.4-Windows-Native-2026-09-20") {
            throw "Build ID complet inattendu: $buildId"
          }
          $filters = & "dist\QuanticStudio\ffmpeg\ffmpeg.exe" -hide_banner -filters 2>&1 | Out-String
          if ($filters -notmatch "\bgfxcapture\b") { throw "gfxcapture absent du FFmpeg complet." }

          $model = Get-Item "dist\QuanticStudio\data\voices\kokoro\kokoro-v1.0.onnx" -ErrorAction Stop
          $voices = Get-Item "dist\QuanticStudio\data\voices\kokoro\voices-v1.0.bin" -ErrorAction Stop
          if ($model.Length -lt 250000000 -or $voices.Length -lt 10000000) {
            throw "Les assets Kokoro complets sont incomplets."
          }

          .\scripts\sign-windows.ps1 -Path @(
            "dist\QuanticStudio\QuanticStudio.exe",
            "dist\QuanticStudio\AuraNativeBroadcast.exe"
          )

          $zip = "release\QuanticStudio-Windows-Native-2.7.4.zip"
          Compress-Archive -Path "dist\QuanticStudio" -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 1000000) { throw "Archive complète anormalement petite." }

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
          }

      - name: Build Quantic Studio 2.7.4 installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version "2.7.4" -SourceDir "dist\QuanticStudio"

      - name: Sign installer when certificate is configured
        shell: pwsh
        env:
          AURA_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_BASE64 }}
          AURA_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: .\scripts\sign-windows.ps1 -Path @("release\QuanticStudio-Setup-2.7.4.exe")

      - name: Build Lite Quantic Studio 2.7.4
        shell: pwsh
        env:
          AURA_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_BASE64 }}
          AURA_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AURA_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (Test-Path "dist\QuanticStudio") { Remove-Item "dist\QuanticStudio" -Recurse -Force }
          .\scripts\build-windows-lite.ps1 -Python python
          .\scripts\install-aura-ffmpeg.ps1 -Destination "dist\QuanticStudio\ffmpeg"
          Copy-Item "engine\quantic-live\target\release\quantic-live.exe" "dist\QuanticStudio\AuraNativeBroadcast.exe" -Force

          if (-not (Test-Path "dist\QuanticStudio\QuanticStudio.exe")) { throw "QuanticStudio.exe absent du package Lite." }
          if (-not (Test-Path "dist\QuanticStudio\AuraNativeBroadcast.exe")) { throw "AuraNativeBroadcast.exe absent du package Lite." }
          if (-not (Test-Path "dist\QuanticStudio\ffmpeg\ffmpeg.exe")) { throw "FFmpeg Aura absent du package Lite." }
          $buildId = (Get-Content "dist\QuanticStudio\BUILD-ID.txt" -Raw).Trim()
          if ($buildId -ne "QuanticStudio-2.7.4-Windows-Native-LITE-2026-09-20") {
            throw "Build ID Lite inattendu: $buildId"
          }
          $filters = & "dist\QuanticStudio\ffmpeg\ffmpeg.exe" -hide_banner -filters 2>&1 | Out-String
          if ($filters -notmatch "\bgfxcapture\b") { throw "gfxcapture absent du FFmpeg Lite." }
          $envContent = Get-Content "dist\QuanticStudio\.env" -Raw
          if ($envContent -notmatch "MAIRAIY_KOKORO_AUTO_DOWNLOAD=true") {
            throw "Auto-download Kokoro inactif dans le Lite."
          }
          if (Test-Path "dist\QuanticStudio\data\voices\kokoro\kokoro-v1.0.onnx") {
            throw "Le modèle Kokoro ne doit pas être embarqué dans le Lite."
          }
          if (Test-Path "dist\QuanticStudio\data\voices\kokoro\voices-v1.0.bin") {
            throw "Le pack de voix Kokoro ne doit pas être embarqué dans le Lite."
          }

          .\scripts\sign-windows.ps1 -Path @(
            "dist\QuanticStudio\QuanticStudio.exe",
            "dist\QuanticStudio\AuraNativeBroadcast.exe"
          )

          $zip = "release\QuanticStudio-Windows-Native-2.7.4-LITE.zip"
          Compress-Archive -Path "dist\QuanticStudio" -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 1000000) { throw "Archive Lite anormalement petite." }

      - name: Package standalone native engine
        shell: pwsh
        run: |
          $dir = "release\Quantic-Studio-Core-Windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "engine\quantic-live\target\release\quantic-live.exe" "$dir\AuraNativeBroadcast.exe" -Force
          Copy-Item "engine\quantic-live\README.md" "$dir\README-Native-Broadcast.md" -Force
          Compress-Archive -Path $dir -DestinationPath "release\Quantic-Studio-Core-Windows-x64.zip" -CompressionLevel Optimal
          Remove-Item $dir -Recurse -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem "release" -File | Where-Object { $_.Extension -in @(".zip", ".exe") } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content "release\SHA256SUMS.txt" -Encoding ascii
          Get-Content "release\SHA256SUMS.txt"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "quantic-studio-v2.7.4"
          $full = "release\QuanticStudio-Windows-Native-2.7.4.zip"
          $lite = "release\QuanticStudio-Windows-Native-2.7.4-LITE.zip"
          $engine = "release\Quantic-Studio-Core-Windows-x64.zip"
          $installer = "release\QuanticStudio-Setup-2.7.4.exe"
          $sums = "release\SHA256SUMS.txt"
          $notes = @"
          # Quantic Studio 2.7.4

          Quantic Studio devient un studio de streaming Windows autonome avec **Quantic Studio Core 0.4** comme moteur par défaut. OBS reste disponible uniquement comme mode de compatibilité manuel.

          ## Points clés
          - Studio glossy unifié : scènes, sources, aperçu, REC, Live, chat, activité et Aura.
          - Capture écran/fenêtre/jeu via Windows Graphics Capture avec fallback adapté.
          - Sources webcam, image, texte, navigateur, Mairaiy et overlays Aura.
          - Encodage NVENC, AMD AMF, Intel QSV ou x264 selon la machine.
          - Mix audio natif : micro + son PC/jeu + Aura/Mairaiy/alertes.
          - Live et enregistrement simultanés.
          - Gestion complète des scènes depuis le Studio.
          - Transitions Cut / Fondu configurables.
          - Replay buffer local et sauvegarde instantanée de clips.
          - Multistream jusqu’à 3 destinations secondaires avec un seul encodage.
          - Sortie RTMP directe.
          - Clé de stream protégée localement par Windows DPAPI, jamais persistée en clair dans engine.json.
          - Aucun compte Microsoft ni service cloud requis pour le coffre RTMP.
          - CI Windows et moteur natif validés sur la branche principale.

          ## Fichiers
          - **QuanticStudio-Windows-Native-2.7.4.zip** : package complet avec assets Kokoro embarqués.
          - **QuanticStudio-Windows-Native-2.7.4-LITE.zip** : package allégé ; Kokoro se télécharge au premier usage.
          - **QuanticStudio-Setup-2.7.4.exe** : installateur Windows recommandé, données utilisateur conservées lors des mises à jour.
          - **Quantic-Studio-Core-Windows-x64.zip** : moteur natif autonome.
          - **SHA256SUMS.txt** : empreintes SHA-256 des archives et de l’installateur.
          - Mise à jour intégrée : Aura vérifie la release officielle et contrôle le SHA-256 avant exécution.
          - Signature Authenticode appliquée automatiquement lorsque le certificat de signature est configuré dans les secrets CI.

          Build complet : `QuanticStudio-2.7.4-Windows-Native-2026-09-20`
          Build Lite : `QuanticStudio-2.7.4-Windows-Native-LITE-2026-09-20`
          Moteur natif : 0.4.1
          "@

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $full $lite $engine $installer $sums --clobber --repo "${{ github.repository }}"
            gh release edit $tag --repo "${{ github.repository }}" --title "Quantic Studio 2.7.4" --notes $notes --latest
          } else {
            gh release create $tag $full $lite $engine $installer $sums `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "Quantic Studio 2.7.4" `
              --notes $notes `
              --latest
          }
