name: Publish AURA human biophysics and evidence UI

on:
  push:
    branches:
      - fix/aura-dialogue-context-causal-gate-20261112
    paths:
      - ".github/workflows/publish-aura-bio-evidence-ui-20261112.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish-evidence-ui:
    if: github.repository == 'XDSawyerLoL/Auralive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve seven-check validated canonical Hostinger artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aura-biovisuel"
          gh run download 43279141162 --repo "$GITHUB_REPOSITORY" \
            --name aura-cloud-hostinger --dir "$RUNNER_TEMP/aura-biovisuel"
          for file in server.js package.json src/brain_biophysics_ui.js \
            src/biophysical_evidence.js src/human_ephys_calibration.js \
            src/human_morphology.js src/biophysical_microcircuit.js \
            src/biophysical_synapses.js \
            scripts/analyze_human_spiking_nwb.py \
            scripts/run_human_swc_neuron.py \
            test/biophysical_evidence_ui.test.js \
            docs/AURA_EMULATION_BIOPHYSIQUE_CERVEAU_CORPS_20261112.md; do
            test -s "$RUNNER_TEMP/aura-biovisuel/$file"
          done
          grep -q 'observed_spike_count:4' "$RUNNER_TEMP/aura-biovisuel/src/biophysical_evidence.js"
          grep -q 'aura-human-biophysical-evidence-v1' "$RUNNER_TEMP/aura-biovisuel/src/biophysical_evidence.js"
          grep -q 'bioEvidencePanel' "$RUNNER_TEMP/aura-biovisuel/src/brain_biophysics_ui.js"
          grep -q "app.get('/api/research/biophysics/evidence'" "$RUNNER_TEMP/aura-biovisuel/src/server.js"
          grep -q 'c12Connect' "$RUNNER_TEMP/aura-biovisuel/src/cortex12_realtime.js"
      - name: Package and integrity verification
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/AURA_CERVEAU_BIOVISUEL_HUMAIN_20261112.zip"
          (cd "$RUNNER_TEMP/aura-biovisuel" && zip -q -r "$ZIP" .)
          unzip -t "$ZIP" | tail -1
          sha256sum "$ZIP" > "$GITHUB_WORKSPACE/AURA_CERVEAU_BIOVISUEL_HUMAIN_20261112.sha256"
      - name: Publish immutable GitHub direct download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="aura-biovisual-human-20261112"
          ZIP="$GITHUB_WORKSPACE/AURA_CERVEAU_BIOVISUEL_HUMAIN_20261112.zip"
          HASH="$GITHUB_WORKSPACE/AURA_CERVEAU_BIOVISUEL_HUMAIN_20261112.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already published; refusing silent overwrite"
            exit 1
          fi
          gh release create "$TAG" "$ZIP" "$HASH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "AURA — cerveau biologique : études humaines et interface probante" \
            --notes "Research preview from successful CI workflow 43279141162 (7 green workflows at source SHA 5dc7a3f). One integrated brain/chat interface now includes a human RC voltage simulation, an explicitly non-human-calibrated HH experiment, verified Allen human-cell morphology and two separate NWB observation receipts (sweep 25 subthreshold -10 pA; sweep 32 4 recorded action potentials at about 130 pA), plus amygdala/glia/body/development validation statuses. Research models are NOT a reproduced human brain. The observed human spikes were NOT generated by a human active cell model. No deploy or database reset; preserve production MySQL memory and credentials."
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,url
