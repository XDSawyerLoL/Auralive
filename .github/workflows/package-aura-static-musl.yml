name: Package AURA Hostinger standalone musl French
on:
  pull_request:
    paths:
      - 'cloud-node/src/embedded_provisioner.js'
      - 'cloud-node/src/embedded_language.js'
      - 'cloud-node/src/dashboard-runtime.js'
      - 'cloud-node/test/embedded_provisioner.test.js'
      - 'cloud-node/test/embedded_language.test.js'
      - '.github/workflows/package-aura-static-musl.yml'
  push:
    branches: [main]
    paths:
      - 'cloud-node/src/embedded_provisioner.js'
      - 'cloud-node/src/embedded_language.js'
      - 'cloud-node/src/dashboard-runtime.js'
      - 'cloud-node/test/embedded_provisioner.test.js'
      - 'cloud-node/test/embedded_language.test.js'
      - '.github/workflows/package-aura-static-musl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-static:
    name: Build standalone llama-server without shared libraries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: alpine:3.21
    steps:
      - uses: actions/checkout@v4
      - name: Install musl build dependencies
        run: apk add --no-cache bash build-base cmake ninja git curl linux-headers binutils
      - name: Fetch pinned llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch b11425 https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          test "$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)" = "e117148a41d8e9bedb72e4c6c3f003ab0fe7f857"
      - name: Build static CPU-only llama-server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/build-static" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DBUILD_SHARED_LIBS=OFF -DGGML_STATIC=ON -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF \
            -DGGML_SSE42=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF \
            -DGGML_F16C=OFF -DGGML_BMI2=OFF \
            -DLLAMA_OPENSSL=OFF -DLLAMA_SUBPROCESS=OFF \
            -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build "$RUNNER_TEMP/build-static" --target llama-server --parallel 4
      - name: Prove no ELF interpreter nor dynamic .so dependency
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/build-static/bin/llama-server"
          test -x "$BIN"
          ! readelf -l "$BIN" | grep -q INTERP
          ! readelf -d "$BIN" | grep -q 'NEEDED'
          "$BIN" --version
          echo 'ELF_STANDALONE_NO_SO_OK'
      - name: Bundle static native engine with canonical Hostinger project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aura-hostinger-static"
          mkdir -p "$ROOT/native/linux-x64"
          cp -R cloud-node/src cloud-node/test cloud-node/scripts "$ROOT/"
          cp cloud-node/server.js cloud-node/package.json cloud-node/package-lock.json \
             cloud-node/.env.example cloud-node/.gitignore cloud-node/README.md \
             cloud-node/HOSTINGER-QUICKSTART.txt cloud-node/STABLE.json "$ROOT/"
          cp "$RUNNER_TEMP/build-static/bin/llama-server" "$ROOT/native/linux-x64/llama-server"
          sha256sum "$ROOT/native/linux-x64/llama-server" | cut -d ' ' -f1 \
             > "$ROOT/native/linux-x64/llama-server.sha256"
          cp "$RUNNER_TEMP/llama.cpp/LICENSE" "$ROOT/native/linux-x64/LLAMA-LICENSE.txt"
          cat > "$ROOT/DEPLOYMENT.json" <<EOF
          {
            "product": "AURA Cloud",
            "version": "3.1.2",
            "runtime": "Node.js 22 / Fastify / MySQL",
            "canonical_source": "cloud-node",
            "git_sha": "$GITHUB_SHA",
            "language_engine": "musl-static-llama-server-b11425",
            "architecture": "linux-x64",
            "no_shared_libraries": true,
            "model": "Qwen3-0.6B-Q8_0.gguf verified cached or downloaded",
            "model_weights_included": false,
            "paid_api_required": false
          }
          EOF
          test -f "$ROOT/server.js"
          test -f "$ROOT/package.json"
          test -f "$ROOT/native/linux-x64/llama-server"
          test ! -d "$ROOT/cloud-node"
      - uses: actions/upload-artifact@v4
        with:
          name: aura-hostinger-static-musl
          path: ${{ runner.temp }}/aura-hostinger-static/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
  verify-glibc-host:
    name: Verify standalone musl on Ubuntu/glibc
    runs-on: ubuntu-latest
    needs: build-static
    timeout-minutes: 4
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aura-hostinger-static-musl
          path: aura-zip-root
      - name: Confirm Linux cross-distro binary and root package
        shell: bash
        run: |
          set -euo pipefail
          BIN=aura-zip-root/native/linux-x64/llama-server
          chmod u+x "$BIN"
          ! readelf -l "$BIN" | grep -q INTERP
          ! readelf -d "$BIN" | grep -q NEEDED
          "$BIN" --version
          test -f aura-zip-root/package.json
          test -f aura-zip-root/server.js
          test ! -d aura-zip-root/cloud-node

  verify-model-inference:
    name: Generate real text with Qwen GGUF (not just ELF --version)
    runs-on: ubuntu-latest
    needs: build-static
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aura-hostinger-static-musl
          path: aura-zip-root
      - name: Download and verify pinned free Qwen3 GGUF
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 \
            --max-time 300 \
            'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf' \
            -o "$RUNNER_TEMP/Qwen3-0.6B-Q8_0.gguf"
          echo "9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031  $RUNNER_TEMP/Qwen3-0.6B-Q8_0.gguf" | sha256sum --check
      - name: Prove a real native completion under 1-thread quota
        shell: bash
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/aura-zip-root/native/linux-x64/llama-server"
          chmod u+x "$BIN"
          export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          "$BIN" -m "$RUNNER_TEMP/Qwen3-0.6B-Q8_0.gguf" --host 127.0.0.1 \
            --port 19473 --ctx-size 768 --threads 1 --threads-batch 1 \
            --threads-http 1 --parallel 1 --batch-size 32 --ubatch-size 16 --no-warmup \
            > "$RUNNER_TEMP/aura-native.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/aura-native.pid"
          trap 'kill "$(cat "$RUNNER_TEMP/aura-native.pid")" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 100); do
            if curl -fsS --max-time 2 http://127.0.0.1:19473/health > "$RUNNER_TEMP/health.json"; then
              ready=1;break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/aura-native.pid")" 2>/dev/null; then
              echo "Model process exited before serving, last safe diagnostic:"
              tail -c 900 "$RUNNER_TEMP/aura-native.log"
              exit 1
            fi
            sleep 2
          done
          test "$ready" = 1
          node <<'NODE'
          const assert = require('node:assert/strict');
          (async () => {
            const r = await fetch('http://127.0.0.1:19473/completion', {
              method:'POST',headers:{'content-type':'application/json'},
              body:JSON.stringify({prompt:'Complète en français : Bonjour, je suis',n_predict:40,temperature:0.2}),
              signal:AbortSignal.timeout(90000)
            });
            assert.equal(r.status,200);
            const json=await r.json();
            const reply=String(json.content||'').trim();
            assert.ok(reply.length>0, 'No real generated text');
            console.log('REAL_GGUF_GENERATED_TOKENS='+(json.tokens_predicted??'unknown'));
            console.log('REAL_GGUF_NONEMPTY_RESPONSE=true');
            // Production AURA speaks through OpenAI-style chat/completions, not /completion.
            // Require real model token accounting to prevent a false healthy result.
            const chat = await fetch('http://127.0.0.1:19473/v1/chat/completions', {
              method:'POST',headers:{'content-type':'application/json'},
              body:JSON.stringify({
                model:'local',stream:false,temperature:0,max_tokens:48,
                chat_template_kwargs:{enable_thinking:false},
                messages:[{role:'user',content:'Réponds en français en un mot : bonjour.'}]
              }),
              signal:AbortSignal.timeout(90000)
            });
            assert.equal(chat.status,200,'chat/completions HTTP failed');
            const payload=await chat.json();
            const content=String(payload?.choices?.[0]?.message?.content||'')
              .replace(/<think>[\s\S]*?<\/think>/gi,'').trim();
            const generated=Number(payload?.usage?.completion_tokens);
            assert.ok(content.length>0,'chat/completions generated no visible text');
            assert.ok(Number.isFinite(generated)&&generated>=1,'chat/completions did not prove token generation');
            console.log('REAL_GGUF_CHAT_COMPLETION_TOKENS='+generated);
            console.log('REAL_GGUF_CHAT_VERIFIED=true');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE

          # The production Hostinger transport now uses a Unix-domain HTTP
          # socket, not a TCP listener. Prove it with the pinned real GGUF.
          kill "$(cat "$RUNNER_TEMP/aura-native.pid")" 2>/dev/null || true
          wait "$(cat "$RUNNER_TEMP/aura-native.pid")" 2>/dev/null || true
          SOCK="$RUNNER_TEMP/aura-qwen-real.sock"
          rm -f "$SOCK"
          "$BIN" -m "$RUNNER_TEMP/Qwen3-0.6B-Q8_0.gguf" --host "$SOCK" \
            --ctx-size 768 --threads 1 --threads-batch 1 \
            --threads-http 1 --parallel 1 --batch-size 32 --ubatch-size 16 --no-warmup \
            > "$RUNNER_TEMP/aura-native-unix.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/aura-native.pid"
          unix_ready=0
          for i in $(seq 1 100); do
            if curl -fsS --max-time 3 --unix-socket "$SOCK" http://localhost/health \
              > "$RUNNER_TEMP/health-unix.json"; then
              unix_ready=1;break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/aura-native.pid")" 2>/dev/null; then
              echo "Unix llama-server exited before serving."
              tail -c 700 "$RUNNER_TEMP/aura-native-unix.log"
              exit 1
            fi
            sleep 2
          done
          test "$unix_ready" = 1
          node <<'NODE_UNIX'
          const assert = require('node:assert/strict');
          const http = require('node:http');
          const socketPath = process.env.RUNNER_TEMP+'/aura-qwen-real.sock';
          const body = JSON.stringify({
            model:'local',stream:false,temperature:0,max_tokens:48,
            chat_template_kwargs:{enable_thinking:false},
            messages:[{role:'user',content:'Réponds en français avec un seul mot : bonjour.'}]
          });
          const req = http.request({socketPath,path:'/v1/chat/completions',
            method:'POST',headers:{'content-type':'application/json'},
            agent:false},res=>{
            const chunks=[];
            res.on('data',part=>chunks.push(part));
            res.on('end',()=>{
              try{
                assert.equal(res.statusCode,200);
                const json=JSON.parse(Buffer.concat(chunks).toString());
                assert.ok(String(json?.choices?.[0]?.message?.content||'').trim().length>0);
                assert.ok(Number(json?.usage?.completion_tokens)>=1);
                console.log('REAL_GGUF_UNIX_CHAT_TOKENS='+json.usage.completion_tokens);
                console.log('REAL_GGUF_UNIX_CHAT_VERIFIED=true');
              }catch(error){console.error(error);process.exitCode=1;}
            });
          });
          req.setTimeout(90000,()=>req.destroy(Error('unix chat timed out')));
          req.on('error',error=>{console.error(error);process.exitCode=1;});
          req.end(body);
          NODE_UNIX
