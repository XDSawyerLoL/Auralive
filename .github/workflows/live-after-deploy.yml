name: AURA Live After Deploy Probe

on:
  push:
    branches:
      - aura/live-smoke-after-deploy-v93

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Hostinger
        env:
          AURA_URL: https://antiquewhite-dolphin-780448.hostingersite.com
        run: |
          set +e
          for path in / /healthz /api/kernel/architecture /api/capabilities; do
            echo "===== $path ====="
            code=$(curl -L -sS -A "Mozilla/5.0 AURA-Diagnostic/1.0" --max-time 25 -o /tmp/body.txt -w "%{http_code}" "$AURA_URL$path")
            rc=$?
            echo "curl_rc=$rc http=$code"
            head -c 4000 /tmp/body.txt || true
            echo
          done

# reprobe 2026-10-02T12:22Z
