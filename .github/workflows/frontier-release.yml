name: Aura Live Frontier Package

on:
  push:
    branches:
      - frontier/aura-live-2
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Validate JavaScript
        run: |
          node --check app/web/static/app.js
          node --check app/web/static/automation.js

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Verify secrets are not tracked
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -Ei '(^|/)(\.env|.*\.(db|sqlite|sqlite3)|.*token.*|.*secret.*|.*credential.*)$' || true)
          if [ -n "$forbidden" ]; then
            echo "Fichiers sensibles suivis par Git :"
            echo "$forbidden"
            exit 1
          fi

      - name: Build clean ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          rsync -a ./ dist/stage/AuraLive-Frontier/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '.venv-v2' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude 'data' \
            --exclude 'logs' \
            --exclude 'backups' \
            --exclude '.env' \
            --exclude 'dist'
          cd dist/stage
          zip -qr ../AuraLive-Frontier.zip AuraLive-Frontier

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraLive-Frontier
          path: dist/AuraLive-Frontier.zip
          if-no-files-found: error
          retention-days: 30
