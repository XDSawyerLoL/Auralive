name: AURA French LLM isolation benchmark
on:
  pull_request:
    paths:
      - 'cloud-node/scripts/benchmark_french_models.py'
      - 'cloud-node/scripts/export_frozen_language_benchmark.mjs'
      - '.github/workflows/aura-french-llm-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aura-french-model-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'experiment/aura-french-llm-comparison-')
    name: Compare LFM2.5, Qwen2.5 and Qwen3 with one CPU thread
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify synthetic benchmark scripts and source of truth
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile cloud-node/scripts/benchmark_french_models.py
          (cd cloud-node && npm ci --ignore-scripts --no-audit --no-fund)
          node cloud-node/scripts/export_frozen_language_benchmark.mjs > "$RUNNER_TEMP/aura-french-frozen-9.json"
          python3 - "$RUNNER_TEMP/aura-french-frozen-9.json" <<'PY'
          import json,sys
          cases=json.load(open(sys.argv[1],encoding='utf-8'))
          assert len(cases)==9 and len({item["dimension"] for item in cases})==9
          print("FROZEN_AURA_FRENCH_TASKS=9")
          PY
      - name: Build same llama.cpp revision for every comparison
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch b11425 https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/aura-bench-llama.cpp"
          test "$(git -C "$RUNNER_TEMP/aura-bench-llama.cpp" rev-parse HEAD)" = "e117148a41d8e9bedb72e4c6c3f003ab0fe7f857"
          cmake -S "$RUNNER_TEMP/aura-bench-llama.cpp" -B "$RUNNER_TEMP/aura-bench-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build "$RUNNER_TEMP/aura-bench-build" --target llama-server --parallel 2
          "$RUNNER_TEMP/aura-bench-build/bin/llama-server" --version
      - name: Download verified GGUF models (no production data)
        shell: bash
        run: |
          set -euo pipefail
          MODELS="$RUNNER_TEMP/aura-models"
          mkdir -p "$MODELS"
          curl -fLSs --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 700 \
            'https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/main/LFM2.5-350M-Q4_K_M.gguf' \
            -o "$MODELS/LFM2.5-350M-Q4_K_M.gguf"
          echo "7e6f72643caafc9a68256686638c4d7916f2cec76d1df478d4c3ddcd95a6aed4  $MODELS/LFM2.5-350M-Q4_K_M.gguf" | sha256sum -c -
          curl -fLSs --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 700 \
            'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf' \
            -o "$MODELS/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  $MODELS/qwen2.5-0.5b-instruct-q4_k_m.gguf" | sha256sum -c -
          curl -fLSs --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 700 \
            'https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf' \
            -o "$MODELS/Qwen3-0.6B-Q4_K_M.gguf"
          echo "ac2d97712095a558e31573f62f466a3f9d93990898b0ec79d7c974c1780d524a  $MODELS/Qwen3-0.6B-Q4_K_M.gguf" | sha256sum -c -
          echo 'GGUF_VERIFIED_MODELS=3'
      - name: Measure real French replies p50 p95 RSS and timeouts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aura-benchmark-results"
          python3 cloud-node/scripts/benchmark_french_models.py \
            --llama-server "$RUNNER_TEMP/aura-bench-build/bin/llama-server" \
            --models-dir "$RUNNER_TEMP/aura-models" \
            --benchmark "$RUNNER_TEMP/aura-french-frozen-9.json" \
            --output "$RUNNER_TEMP/aura-benchmark-results" \
            --repeats 2 --request-timeout 25 --startup-timeout 100
      - name: Upload results (never model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-french-llm-benchmark-results
          path: ${{ runner.temp }}/aura-benchmark-results/
          retention-days: 14
          if-no-files-found: warn
