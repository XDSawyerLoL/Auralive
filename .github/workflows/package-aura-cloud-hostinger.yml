name: Package AURA Cloud Hostinger (canonical Node)

on:
  pull_request:
    paths:
      - "cloud-node/**"
      - ".github/workflows/package-aura-cloud-hostinger.yml"
      - ".github/workflows/package-aura-cloud-node.yml"
  push:
    branches:
      - main
    paths:
      - "cloud-node/**"
      - ".github/workflows/package-aura-cloud-hostinger.yml"
      - ".github/workflows/package-aura-cloud-node.yml"
  workflow_dispatch:

jobs:
  package-aura-cloud-hostinger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud-node/package-lock.json

      - name: Prepare canonical AURA Cloud Node Hostinger upload
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aura-cloud-hostinger"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          cp -R cloud-node/src "$ROOT/src"
          cp -R cloud-node/test "$ROOT/test"
          cp -R cloud-node/scripts "$ROOT/scripts"
          cp cloud-node/server.js cloud-node/package.json cloud-node/package-lock.json \
             cloud-node/.env.example cloud-node/.gitignore cloud-node/README.md \
             cloud-node/HOSTINGER-QUICKSTART.txt cloud-node/STABLE.json "$ROOT/"

          PACKAGE_VERSION="$(node -p "require('./cloud-node/package.json').version")"
          cat > "$ROOT/DEPLOYMENT.json" <<EOF
          {
            "product": "AURA Cloud",
            "version": "$PACKAGE_VERSION",
            "runtime": "Node.js 22 / Fastify / MySQL",
            "target": "Hostinger Node.js Web App",
            "canonical_source": "cloud-node",
            "git_sha": "$GITHUB_SHA",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "direct_dashboard_chat": true,
            "browser_token_required": false,
            "private_admin_endpoints": true,
            "cognition_native": true,
            "zero_cost_guard": true
          }
          EOF

          test -f "$ROOT/package.json"
          test -f "$ROOT/package-lock.json"
          test -f "$ROOT/server.js"
          test -f "$ROOT/src/server.js"
          test -f "$ROOT/src/dashboard.js"
          test -f "$ROOT/src/dashboard-runtime.js"

          cd "$ROOT"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          rm -rf node_modules

          # Hostinger must see package.json and server.js at archive root.
          test -f package.json
          test -f server.js
          test ! -d cloud-node

      - name: Upload canonical Hostinger-ready project root
        uses: actions/upload-artifact@v4
        with:
          name: aura-cloud-hostinger
          path: ${{ runner.temp }}/aura-cloud-hostinger/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
