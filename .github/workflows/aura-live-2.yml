name: Aura Live 2 validation

on:
  push:
    branches: ["integration/aura-live-2"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Python compile
        run: python -m compileall -q app tests
      - name: Tests
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check app/web/static/app.js
          node --check app/web/static/automation.js
          node --check app/web/static/avatar-studio.js
