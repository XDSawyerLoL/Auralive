name: Publish Aura Live FastVoice Windows Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-fastvoice-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Build validated Windows package
        shell: pwsh
        run: .\scripts\build-windows-lite.ps1 -Python python

      - name: Verify package identity
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AuraLive\AuraLive.exe")) { throw "AuraLive.exe absent." }
          $buildId = (Get-Content "dist\AuraLive\BUILD-ID.txt" -Raw).Trim()
          if ($buildId -ne "AuraLive-2.5-Windows-FastVoiceOAuth-LITE-2026-09-05") {
            throw "Build ID inattendu: $buildId"
          }
          $envContent = Get-Content "dist\AuraLive\.env" -Raw
          if ($envContent -notmatch "MAIRAIY_KOKORO_AUTO_DOWNLOAD=true") {
            throw "Auto-download Kokoro inactif."
          }

      - name: Smoke test packaged executable
        shell: pwsh
        env:
          AURA_PORT: "18787"
          AURA_PUBLIC_BASE_URL: "http://localhost:18787"
          TWITCH_REDIRECT_URI: "http://localhost:18787/auth/callback"
          AI_MODE: "off"
          OBS_AUTO_CONNECT: "false"
          OBS_ENABLED: "false"
          MAIRAIY_KOKORO_PRIMARY: "true"
          MAIRAIY_KOKORO_ENABLED: "true"
          MAIRAIY_KOKORO_AUTO_DOWNLOAD: "true"
          MAIRAIY_KOKORO_VOICE: "ff_siwis"
          MAIRAIY_KOKORO_LANGUAGE: "fr-fr"
        run: |
          $process = Start-Process "dist\AuraLive\AuraLive.exe" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { throw "AuraLive.exe s'est ferme au demarrage." }
              try {
                $health = Invoke-WebRequest "http://127.0.0.1:18787/health" -UseBasicParsing -TimeoutSec 2
                if ($health.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "AuraLive n'a pas expose /health." }

            $voice = Invoke-RestMethod "http://127.0.0.1:18787/api/avatar/test" `
              -Method Post `
              -ContentType "application/json" `
              -Body '{"text":"Test final de Mairaiy sans OBS."}' `
              -TimeoutSec 180
            if ($voice.engine -ne "kokoro-local" -or -not $voice.audio_url) {
              $voice | ConvertTo-Json -Depth 8 | Write-Host
              throw "La voix Kokoro n'a pas ete generee."
            }
            $audio = Invoke-WebRequest ("http://127.0.0.1:18787" + $voice.audio_url) -UseBasicParsing -TimeoutSec 15
            if ($audio.RawContentLength -le 44) { throw "WAV Kokoro vide." }
          } finally {
            if (-not $process.HasExited) {
              try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
            }
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          $zip = "AuraLive-Windows-FastVoiceOAuth-2026-09-05.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\AuraLive" -DestinationPath $zip -CompressionLevel Optimal
          $size = (Get-Item $zip).Length
          if ($size -lt 1000000) { throw "Archive Windows anormalement petite." }
          Write-Host "Release ZIP: $size bytes"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "auralive-fastvoiceoauth-2026-09-05"
          $zip = "AuraLive-Windows-FastVoiceOAuth-2026-09-05.zip"
          $notes = @"
          Aura Live Windows — FastVoiceOAuth

          Version validee sur le vrai executable Windows :
          - OAuth Twitch dans le navigateur Windows normal
          - Tester la voix sans OBS
          - Voice Control raccourci pour reduire fortement la latence
          - Kokoro local ff_siwis
          - telechargement automatique des actifs Kokoro si necessaire

          Build ID : AuraLive-2.5-Windows-FastVoiceOAuth-LITE-2026-09-05
          "@
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $zip `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "Aura Live Windows — FastVoiceOAuth" `
              --notes $notes
          }
