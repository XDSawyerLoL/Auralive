[package]
name = "aura-fabric"
version = "0.1.0"
edition = "2024"
description = "AURA distributed DAG scheduler and capability-fabric core"
license = "MIT"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
